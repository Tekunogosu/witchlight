[package]
name = "witchlight"
version = "0.41.1"
edition = "2024"
description = "Renders and serves a browsable map from Vintage Story world exports"
license = "MIT"

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
# raw_value keeps the mod's marker arrays as the text they arrived as, so this
# service never has to read a waypoint to decide who may see it.
serde_json = { version = "1.0.151", features = ["raw_value"] }
clap = { version = "4.6.6", features = ["color", "suggestions", "derive"] }
rayon = "1.11.1"
flate2 = "1.1.9"
tiny_http = "0.12.0"
ureq = { version = "3.4.0", default-features = false }
toml = "1.1.4"
dirs = "6.0.0"
getrandom = "0.4.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
