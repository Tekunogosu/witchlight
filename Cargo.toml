[package]
name = "mapstique"
version = "0.9.0"
edition = "2024"
description = "Renders and serves a browsable map from Vintage Story world exports"
license = "MIT OR Apache-2.0"

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["color", "suggestions", "derive"] }
rayon = "1.11.1"
flate2 = "1.1.9"
tiny_http = "0.12.0"
toml = "1.1.4"
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
