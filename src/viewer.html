  markerSave.textContent = 'Save';

  const [x, z] = said(place.X, place.Z);
  markerName.value = place.Title || '';
  markerX.value = x;
  markerY.value = place.Y;
  markerZ.value = z;
  chosenColour = place.Color || '#ffffff';
  chosenPicture = place.Icon || 'circle';
  markerPrivate.checked = Boolean(place.Private);
  markerRemember.checked = false;
  showRemember();
  showCompose();

  // A marker somebody else owns is theirs to be seen by whoever they let; taking
  // it private would be taking it off their own map.
  const ours = viewer && place.OwnerUid === viewer.Uid;
  markerPrivate.disabled = !ours;
  document.querySelector('.deed .keep').title =
    ours ? '' : "Only a marker's owner decides who sees it";
}

/**
 * Opens the form on a preset, beside the list it came from.
 *
 * The same window, because a preset is a marker with the place left out: it says
 * what a thing is called, what colour it is, which picture it takes and who sees
 * it, and those are the questions this window already asks. What it does not ask
 * is where — so the coordinates give way to the pattern, which is a preset's own
 * version of the same question.
 */
function editPreset(at) {
  const preset = (mine.Presets || [])[at];
  if (!preset) return;

  mode = 'preset';
  editing = null;
  editingPreset = at;
  clicked = null;
  composeTitle.textContent = 'Edit preset';
  // Said on the button, so it is plain that this changes the preset that was
  // picked rather than adding another one beside it.
  markerSave.textContent = 'Update';

  markerName.value = preset.Title || '';
  markerPattern.value = preset.Pattern || '';
  chosenColour = preset.Color || '#ffffff';
  chosenPicture = preset.Icon || 'circle';
  markerPrivate.checked = preset.Private === true;
  markerPrivate.disabled = false;
  markerRemember.checked = false;
  showRemember();
  showCompose();
  besideThePresets();
  drawPresets();
}

/** Opens the form on a preset that does not exist yet. */
function newPreset() {
  mode = 'preset';
  editing = null;
  editingPreset = -1;
  clicked = null;
  composeTitle.textContent = 'New preset';
  markerSave.textContent = 'Create';

  markerName.value = '';
  markerPattern.value = '';
  chosenColour = palette[0] || '#ffffff';
  chosenPicture = 'circle';
  markerPrivate.checked = privateByDefault();
  markerPrivate.disabled = false;
  markerRemember.checked = false;
  showRemember();
  showCompose();
  besideThePresets();
  drawPresets();
  markerPattern.focus();
}

/** Puts the form beside the list it was opened from, where there is room. */
function besideThePresets() {
  const list = presetPanel.getBoundingClientRect();
  if (list.width === 0) return;
  settleWindow(composer, list.right + 10, list.top);
}

/** Everything both ways in have in common: draw it, and say whether it can act. */
function showCompose() {
  openWindow(composer);
  showFields();
  drawColours();
  drawPictures();
  frame();

  if (viewer && viewer.Name) {
    sayHere('');
    markerSave.disabled = false;
    markerName.focus();
    markerName.select();
  } else {
    sayHere('Run /witchlight login in the game to make a marker.', true);
    markerSave.disabled = true;
  }


  // A page that loaded before the mod had posted anything has no colours to
  // offer. Asked again here rather than only at start, which is the same rule
  // the marker pictures follow.
  if (palette.length === 0) pollColours().then(drawColours);
}

/**
 * Which of the form's questions this mode can answer.
 *
 * A preset has no place, and a marker has no pattern — except when it is also
 * being kept as a preset, which is the one case where both are asked at once.
 * The box that decides that is offered whenever a new marker is being made,
 * whether or not a block was clicked: what a preset is remembered against can be
 * typed as readily as it can be pointed at.
 */
function showFields() {
  const preset = mode === 'preset';
  rememberLine.style.display = mode === 'new' ? '' : 'none';
  rememberWhat.textContent = clicked ? (clicked.name || shortCode(clicked.code)) : 'a block';
  document.getElementById('pattern-field').style.display =
    preset || (mode === 'new' && markerRemember.checked) ? '' : 'none';
  document.getElementById('place-field').style.display = preset ? 'none' : '';
}

/** Kept for the callers that only mean the one line. */
function showRemember() {
  showFields();
}

function forgetCompose() {
  setPlacing(false);
  awaiting = null;
  mode = 'new';
  editing = null;
  editingPreset = -1;
  clicked = null;
  markerPattern.value = '';
  closeFound();
  drawPresets();
  markerPrivate.disabled = false;
  markerName.value = '';
  markerX.value = '';
  markerY.value = '';
  markerZ.value = '';
  sayHere('');
}

function closeCompose() {
  shutWindow(composer);
}

/** Which numbers the coordinate fields are in, said where they are typed. */
function frame() {
  document.getElementById('place-said').textContent =
    settings.absolute.on ? 'Coords — absolute' : 'Coords — relative';
}

/**
 * The reader changed which numbers the page counts in, so what is already typed
 * is rewritten to mean the same place.
 *
 * Leaving them alone would move a half-filled marker by a spawn without touching
 * it. Called after the setting has flipped, so what is in the fields is in the
 * frame that is no longer current.
 */
function reframe() {
  frame();
  const absolute = settings.absolute.on;
  for (const [field, origin] of [[markerX, spawn.x], [markerZ, spawn.z]]) {
    const held = Number(field.value);
    if (field.value.trim() === '' || !Number.isFinite(held)) continue;
    field.value = Math.round(absolute ? held + origin : held - origin);
  }
}

/**
 * The colours the game offers.
 *
 * Asked of the service rather than written down here, so a mod that adds a
 * colour to the game's picker adds it to this one. A service that has not heard
 * from a mod yet has none to offer, and the form falls back to plain white so
 * that it is still a form.
 */
function drawColours() {
  const box = document.getElementById('colours');
  box.textContent = '';
  const offered = palette.length > 0 ? palette : ['#ffffff'];
  if (!offered.includes(chosenColour)) offered.unshift(chosenColour);

  for (const colour of offered) {
    const swatch = document.createElement('button');
    swatch.type = 'button';
    swatch.className = 'swatch' + (colour === chosenColour ? ' chosen' : '');
    swatch.style.background = colour;
    swatch.title = colour;
    // One of thirty-odd identical squares, so the colour is the only thing that
    // tells a reader — or a test — which one this is.
    swatch.setAttribute('aria-label', `Colour ${colour}`);
    swatch.setAttribute('aria-pressed', String(colour === chosenColour));
    swatch.addEventListener('click', () => {
      chosenColour = colour;
      drawColours();
      // The pictures are drawn in it, so they are drawn again.
      drawPictures();
    });
    box.append(swatch);
  }
}

/** The pictures the service has, drawn as the markers they will become. */
function drawPictures() {
  const box = document.getElementById('pictures');
  box.textContent = '';
  const offered = [...icons].sort();
  if (offered.length === 0) offered.push('circle');
  if (!offered.includes(chosenPicture)) chosenPicture = offered[0];

  for (const name of offered) {
    box.append(pictureButton(name, chosenColour, name === chosenPicture, () => {
      chosenPicture = name;
      drawPictures();
    }));
  }
}

/** One marker picture as a button, drawn the way the marker itself will be. */
function pictureButton(name, colour, chosen, chose) {
  const swatch = document.createElement('button');
  swatch.type = 'button';
  swatch.className = 'swatch' + (chosen ? ' chosen' : '');
  swatch.title = name;
  swatch.setAttribute('aria-label', `Picture ${name}`);
  swatch.setAttribute('aria-pressed', String(chosen));

  const mark = document.createElement('i');
  mark.style.background = colour;
  const url = `url(/icons/${encodeURIComponent(name)}.svg)`;
  mark.style.webkitMaskImage = url;
  mark.style.maskImage = url;
  swatch.append(mark);
  swatch.addEventListener('click', chose);
  return swatch;
}

/**
 * Naming the spot by pointing at it.
 *
 * The block picker is a different tool answering a different question, and two
 * cursors claiming the same click is one of them being ignored, so arming this
 * disarms that.
 */
function setPlacing(on) {
  placing = on;
  if (on && picking) setPicking(false);
  markerPick.classList.toggle('armed', on);
  markerPick.setAttribute('aria-pressed', String(on));
  map.getContainer().classList.toggle('picking', on || picking);
  if (!on && !picking) forget();
  if (on) sayHere('Click the map where the marker goes.');
}

/** Moves the outline while a spot is being pointed at. */
function hover(latlng) {
  if (!placing || !latlng) return;
  const block = { x: Math.floor(latlng.lng), z: Math.floor(latlng.lat) };
  outline.setBounds([at(block.x, block.z), at(block.x + 1, block.z + 1)]);
  layer(outline, true);
}

/**
 * Takes the spot that was clicked, and the height of the ground on it.
 *
 * The map is looked at from above, so a click names two of the three numbers a
 * waypoint needs. The third is what the renderer drew for that same pixel, which
 * is the surface — and the surface is where somebody pointing at the map means.
 */
async function settle(latlng) {
  const block = { x: Math.floor(latlng.lng), z: Math.floor(latlng.lat) };
  const [x, z] = said(block.x, block.z);
  markerX.value = x;
  markerZ.value = z;
  setPlacing(false);
  sayHere('');

  const ground = await lookUp(block.x, block.z);
  if (ground && typeof ground.y === 'number') markerY.value = ground.y;
}

/**
 * Asks for the marker, whether it is a new one or a change to one that exists.
 *
 * Nothing is done here and the page does not pretend otherwise: it says what it
 * asked for, and waits to see the marker arrive among the rest. A marker that
 * never arrives is a game server that stopped collecting, which the service can
 * tell apart from a slow one and this asks it to.
 */
async function askForMarker() {
  if (mode === 'preset') {
    await updatePreset();
    return;
  }

  const x = Number(markerX.value);
  const y = Number(markerY.value);
  const z = Number(markerZ.value);
  if (![markerX, markerY, markerZ].every(field => field.value.trim() !== '')
      || ![x, y, z].every(Number.isFinite)) {
    sayHere('A marker needs a place: type one, or pick it on the map.', true);
    return;
  }

  const [worldX, worldZ] = meant(x, z);
  const marker = {
    Title: markerName.value.trim(),
    Icon: chosenPicture,
    Color: chosenColour,
    X: worldX,
    Y: Math.round(y),
    Z: worldZ,
    Private: markerPrivate.checked,
  };

  markerSave.disabled = true;
  sayHere('Asking the game server…');

  // A preset is this page's own record and lands whatever the game says, so it
  // is kept first: a marker that fails to reach a stopped game server should not
  // also lose the choice to remember what it was for.
  if (markerRemember.checked) await rememberPreset(marker);

  let answer;
  try {
    answer = editing
      ? await fetch(`/markers/${encodeURIComponent(editing.Key)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(marker),
      })
      : await fetch('/markers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(marker),
      });
  } catch (error) {
    sayHere('The map service is not answering.', true);
    markerSave.disabled = false;
    return;
  }

  if (!answer.ok) {
    // The service says which field was wrong, in words meant to be read.
    sayHere(await answer.text().catch(() => 'That was refused.'), true);
    markerSave.disabled = false;
    return;
  }

  const { Key } = await answer.json().catch(() => ({}));
  awaiting = Key || null;
  askedAt = Date.now();
  // A change keeps the marker's own name, so the page has to watch for the
  // marker's shape rather than for a name it has not seen before.
  changedShape = editing ? JSON.stringify(marker) : null;
  sayHere(editing ? 'Waiting for the game server to change it…'
                  : 'Waiting for the game server to make it…');
}

/**
 * Writes back the preset this form was opened on.
 *
 * Nothing waits on the game here: a preset is this page's own record of what a
 * marker should start as, so it is kept and done. The list behind is drawn again
 * from what came back, which is how a pattern the service trimmed shows up here
 * rather than only on the next load.
 */
async function updatePreset() {
  const pattern = markerPattern.value.trim();
  if (pattern === '') {
    sayHere('A preset needs something to match. `*` stands for any run of characters.', true);
    return;
  }

  const presets = (mine.Presets || []).slice();
  const making = editingPreset < 0;
  if (!making && !presets[editingPreset]) {
    sayHere('That preset is no longer there.', true);
    return;
  }

  const kept = {
    Pattern: pattern,
    Title: markerName.value.trim(),
    Icon: chosenPicture,
    Color: chosenColour,
    Private: markerPrivate.checked,
  };
  if (making) presets.unshift(kept);
  else presets[editingPreset] = kept;

  markerSave.disabled = true;
  sayHere('Keeping…');
  if (await keepMine({ ...mine, Presets: presets })) {
    // A new one is now first in the list, and this window is what is editing it,
    // so the two agree about which row is open rather than the form quietly
    // being about nothing.
    if (making) {
      editingPreset = 0;
      composeTitle.textContent = 'Edit preset';
      markerSave.textContent = 'Update';
    }
    drawPresets();
    sayHere(making ? 'Created.' : 'Updated.');
  } else {
    sayHere('The map service is not answering.', true);
  }
  markerSave.disabled = false;
}

/** What an edit asked for, so its arrival can be told from the old marker. */
let changedShape = null;

/** Keeps what this marker is, against whatever was clicked to place it. */
async function rememberPreset(marker) {
  // What was typed, or failing that what was clicked. Nothing to key it on is
  // not worth stopping a marker over — the marker is the point and the preset is
  // the extra.
  const pattern = markerPattern.value.trim() || (clicked && clicked.code) || '';
  if (pattern === '') return;

  const kept = {
    Pattern: pattern,
    Title: marker.Title,
    Icon: marker.Icon,
    Color: marker.Color,
    Private: marker.Private,
  };

  const presets = (mine.Presets || []).filter(preset => preset.Pattern !== pattern);
  presets.unshift(kept);
  await keepMine({ ...mine, Presets: presets });
}

/** The marker asked for has arrived, so the form has nothing left to do. */
function landed() {
  awaiting = null;
  changedShape = null;
  markerSave.disabled = false;
  closeCompose();
}

/** It has not arrived, and the service says whether anything is collecting. */
async function lost() {
  awaiting = null;
  changedShape = null;
  markerSave.disabled = false;
  await pollMe();
  sayHere(viewer && viewer.Waiting > 0
    ? 'The game server has not collected it. Is it running?'
    : 'The marker was taken but has not appeared. Try again.', true);
}

/** Whether the marker this page is waiting on is among these. */
function arrived(places) {
  const found = places.find(place => place.Key === awaiting);
  if (!found) return false;
  if (!changedShape) return true;

  // An edit comes back under the name it already had, so its arrival is the
  // moment the marker reads as what was asked for rather than as what it was.
  return JSON.stringify({
    Title: found.Title,
    Icon: found.Icon,
    Color: found.Color,
    X: found.X,
    Y: found.Y,
    Z: found.Z,
    Private: found.Private,
  }) === changedShape;
}

/**
 * Whether this person may change this marker.
 *
 * Its owner always may; anybody else only where the operator has said public
 * markers are everyone's to correct, and only for one that is in fact public.
 * The mod decides this again against the waypoint itself before anything moves —
 * what is worked out here only decides whether an edit is offered, because what
 * this page knows about who owns what came from a post that may be seconds old.
 */
function mayEdit(place) {
  if (!viewer || !viewer.Uid) return false;
  if (place.OwnerUid === viewer.Uid) return true;
  return Boolean(viewer.PublicMarkersEditable) && !place.Private;
}

/**
 * Finding a block by name.
 *
 * A preset is keyed on a block code and nobody knows
 * `game:smallplants-fern-normal` from memory. The whole table is eleven thousand
 * entries, which is not a thing to hand a page on the chance somebody opens a
 * form, so the service is asked as the box is typed into and answers with a
 * screenful.
 *
 * What is typed stays what is kept. Picking from the list writes a code into the
 * box, and the box is still a box: a pattern with a `*` in it is typed straight
 * in and no search will have offered it.
 */
const blockFound = document.getElementById('block-found');

/** The search this page is waiting on, so a fast typist asks once. */
let searching = null;

function buildBlockSearch() {
  markerPattern.addEventListener('input', () => {
    clearTimeout(searching);
    searching = setTimeout(findBlocks, 160);
  });
  markerPattern.addEventListener('focus', () => {
    if (markerPattern.value.trim() !== '') findBlocks();
  });
  // A click elsewhere is done looking. Not `blur`: that fires before the click
  // on a result lands, which would close the list out from under the choice.
  addEventListener('pointerdown', event => {
    if (!event.target.closest('#pattern-field')) closeFound();
  });
  markerPattern.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeFound();
  });
}

function closeFound() {
  blockFound.classList.remove('open');
  markerPattern.setAttribute('aria-expanded', 'false');
}

async function findBlocks() {
  const asked = markerPattern.value.trim();
  if (asked === '') {
    closeFound();
    return;
  }

  let found = [];
  try {
    found = await (await fetch(`/blocks.json?q=${encodeURIComponent(asked)}`)).json();
  } catch (error) {
    /* the service may be restarting; an empty list says so quietly enough */
  }

  blockFound.textContent = '';
  if (!Array.isArray(found) || found.length === 0) {
    closeFound();
    return;
  }

  for (const block of found) {
    const choice = document.createElement('button');
    choice.type = 'button';
    choice.setAttribute('role', 'option');
    const name = document.createElement('b');
    name.textContent = block.Name || shortCode(block.Code);
    const code = document.createElement('span');
    code.textContent = block.Code;
    choice.append(name, code);
    // Named by the block it stands for, so a reader hears which of a list of
    // near-identical rows this is rather than "button".
    choice.setAttribute('aria-label', `${block.Name || ''} ${block.Code}`.trim());
    choice.addEventListener('click', () => {
      markerPattern.value = block.Code;
      // A preset with no name of its own takes the block's, which is what
      // somebody picking "Eagle fern" out of a list meant by picking it.
      if (markerName.value.trim() === '' && block.Name) markerName.value = block.Name;
      closeFound();
      markerPattern.focus();
    });
    blockFound.append(choice);
  }

  blockFound.classList.add('open');
  markerPattern.setAttribute('aria-expanded', 'true');
}

function buildCompose() {
  for (const panel of [composer, document.getElementById('presets'),
                       document.getElementById('profile')]) {
    dragBy(panel);
  }

  markerPick.addEventListener('click', () => setPlacing(!placing));
  markerSave.addEventListener('click', askForMarker);
  document.getElementById('marker-cancel').addEventListener('click', closeCompose);
  markerName.addEventListener('keydown', event => {
    if (event.key === 'Enter') askForMarker();
  });
  // The box decides whether there is a pattern to fill in, so it redraws the
  // form rather than only remembering its own state.
  markerRemember.addEventListener('change', showFields);
  buildBlockSearch();

  // A right click names the spot, and what is on it names the marker. Both come
  // from the one lookup the block picker already uses.
  map.on('contextmenu', event => {
    L.DomEvent.preventDefault(event.originalEvent);
    const block = { x: Math.floor(event.latlng.lng), z: Math.floor(event.latlng.lat) };
    openCompose(block, null);
    lookUp(block.x, block.z).then(ground => {
      if (!ground || composer.classList.contains('open') === false) return;
      if (typeof ground.y === 'number' && markerY.value === '') markerY.value = ground.y;
      if (ground.code && !editing) openCompose(block, { code: ground.code, name: ground.name });
    });
  });

  map.on('click', event => {
    if (placing) settle(event.latlng);
  });

  markerButton.addEventListener('click', () => {
    if (composer.classList.contains('open')) closeCompose();
    else openCompose(null, null);
  });
}

/**
 * Which colours the game offers.
 *
 * Asked once at start and again whenever the form is opened without them, which
 * is what happens when the page loaded before the mod had posted anything.
 */
async function pollColours() {
  try {
    const offered = await (await fetch('/colors.json')).json();
    if (Array.isArray(offered) && offered.length > 0) palette = offered;
  } catch (error) {
    /* the service may be restarting */
  }
}


/**
 * Who you are, and what you have told the map about yourself.
 *
 * Two kinds of thing sit in one window because there is one question behind
 * them — how this person wants the map to behave — but they are kept in
 * different places. Where a new marker starts, and every preset, are about the
 * person: they go to the service against their uid and follow them to any
 * browser. How large the page draws itself is about the screen in front of them,
 * and stays here.
 */

const profile = document.getElementById('profile');
const presetPanel = document.getElementById('presets');
const wantPresets = document.getElementById('want-presets');
const wantPrivate = document.getElementById('want-private');
const wantSaid = document.getElementById('want-said');

/** Reads back what this person has set. Nobody signed in has set nothing. */
async function pollMine() {
  if (!(viewer && viewer.Name)) {
    mine = { Presets: [], PresetsByDefault: false };
    return;
  }
  try {
    const held = await (await fetch('/me/preferences.json', { cache: 'no-store' })).json();
    mine = held && typeof held === 'object' ? held : mine;
  } catch (error) {
    /* the service may be restarting; what is held stands until it answers */
  }
}

/**
 * Keeps what this person has set, and takes back what the service made of it.
 *
 * The whole document goes each time. It is a handful of presets and two
 * switches, so sending all of it costs nothing and there is no merge to get
 * wrong; what comes back is what was actually stored, which is how a pattern
 * trimmed or a preset dropped shows up here rather than only on the next load.
 */
async function keepMine(asked) {
  const before = mine;
  mine = asked;
  try {
    const answer = await fetch('/me/preferences', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(asked),
    });
    if (!answer.ok) throw new Error(answer.status);
    mine = await answer.json();
    return true;
  } catch (error) {
    mine = before;
    return false;
  }
}

/** Draws the window on whoever is looking. */
function drawProfile() {
  const named = viewer && viewer.Name;
  document.getElementById('profile-name').textContent = named || 'Not signed in';
  document.getElementById('sign-out').style.display = named ? '' : 'none';

  const face = document.getElementById('profile-face');
  face.textContent = '';
  // The picture the game drew of them, where they are online and have sent one.
  // Nothing else here knows how a portrait is named for somebody who is not —
  // the mod decides that, and it says so only about players who are on.
  const them = named && players.find(player => player.Uid === viewer.Uid);
  const source = them ? portraitSrc(them) : '';
  if (source) {
    const picture = document.createElement('img');
    picture.src = source;
    picture.alt = '';
    face.append(picture);
  } else {
    face.textContent = '\u{1F464}';
  }

  wantPresets.checked = Boolean(mine.PresetsByDefault);
  wantPrivate.checked = privateByDefault();
  wantPresets.disabled = !named;
  wantPrivate.disabled = !named;
  wantSaid.textContent = named
    ? (mine.PrivateByDefault === true || mine.PrivateByDefault === false
      ? 'Your own choice, over the server default.'
      : `Following the server default, which is ${viewer && viewer.MarkersPublic ? 'public' : 'private'}.`)
    : 'Run /witchlight login in the game to keep settings.';

  for (const part of Object.keys(scales)) {
    document.getElementById(`scale-${part}`).value = String(scales[part]);
  }
  draftProfile();
}

/**
 * The presets, as a list to pick from.
 *
 * Names and nothing else. What a preset holds is edited in the marker window,
 * which already asks every one of those questions — two sets of pickers for one
 * choice is two places for it to end up looking different.
 */
function drawPresets() {
  const list = document.getElementById('preset-list');
  list.textContent = '';

  (mine.Presets || []).forEach((preset, at) => {
    const row = document.createElement('div');
    row.className = 'preset' + (mode === 'preset' && at === editingPreset ? ' chosen' : '');

    // Drawn as the marker it makes, so the list reads as what it produces.
    const mark = document.createElement('span');
    mark.className = 'mark';
    const shape = document.createElement('i');
    shape.style.background = preset.Color || '#ffffff';
    const url = `url(/icons/${encodeURIComponent(preset.Icon || 'circle')}.svg)`;
    shape.style.webkitMaskImage = url;
    shape.style.maskImage = url;
    mark.append(shape);

    const said = document.createElement('button');
    said.type = 'button';
    said.className = 'said';
    const name = document.createElement('b');
    name.textContent = preset.Title || '(unnamed)';
    const pattern = document.createElement('span');
    pattern.textContent = preset.Pattern || '';
    said.append(name, pattern);
    // One of a list of identical rows, so the name it stands for is the only
    // thing telling a reader — or a test — which one this is.
    said.setAttribute('aria-label', `Edit preset ${preset.Title || preset.Pattern}`);
    said.addEventListener('click', () => editPreset(at));

    const drop = document.createElement('button');
    drop.type = 'button';
    drop.className = 'shut';
    drop.textContent = '×';
    drop.title = 'Delete this preset';
    drop.setAttribute('aria-label', `Delete preset ${preset.Title || preset.Pattern}`);
    drop.addEventListener('click', () => dropPreset(at));

    row.append(mark, said, drop);
    list.append(row);
  });
}

/** Takes one preset away, and closes the form if it was the one open. */
async function dropPreset(at) {
  const presets = (mine.Presets || []).slice();
  const gone = presets.splice(at, 1)[0];
  if (!gone) return;

  if (mode === 'preset' && editingPreset === at) closeCompose();
  else if (mode === 'preset' && editingPreset > at) editingPreset--;

  sayPresets('Deleting…');
  if (await keepMine({ ...mine, Presets: presets })) {
    drawPresets();
    sayPresets(`Deleted ${gone.Title || gone.Pattern}.`);
  } else {
    sayPresets('The map service is not answering.', true);
  }
}

function sayPresets(what, wrong) {
  const said = document.getElementById('preset-said');
  said.textContent = what || '';
  said.classList.toggle('wrong', Boolean(wrong));
}

/**
 * What the profile window is holding but has not kept.
 *
 * The switches wait for Save. The sliders do not — a size you cannot see is a
 * size you cannot choose — but they land on release rather than as they move: a
 * slider that applies on every step rescales the window the slider is in, which
 * walks it out from under the pointer and makes the thing impossible to set.
 */
let draft = null;

/** Reads the switches into a draft, so what is shown is what Save will keep. */
function draftProfile() {
  draft = { presets: wantPresets.checked, private: wantPrivate.checked };
}

/**
 * Takes a size, once the hand has let go of the slider.
 *
 * Kept as it is set rather than waiting for Save, because the whole of what a
 * size slider is for is seeing the answer. Where the window sits is worked out
 * again straight after: it just changed size, and a window grown against the
 * edge of the screen has to be pulled back to stay reachable.
 */
function takeScale(part, size) {
  scales[part] = size;
  applyScales();
  remember();
  const held = windowsAt.get(profile);
  if (held) settleWindow(profile, held.x, held.y);
}

function sayProfile(what, wrong) {
  const said = document.getElementById('profile-said');
  said.textContent = what || '';
  said.classList.toggle('wrong', Boolean(wrong));
}

/** Keeps everything the window is holding: yours on the service, the sizes here. */
async function keepProfile() {
  if (!draft) return;

  if (!(viewer && viewer.Name)) {
    sayProfile('Sign in to keep these.', true);
    return;
  }

  sayProfile('Keeping…');
  const kept = await keepMine({
    ...mine,
    PresetsByDefault: draft.presets,
    PrivateByDefault: draft.private,
  });
  drawProfile();
  sayProfile(kept ? 'Kept.' : 'The map service is not answering.', !kept);
  if (kept) shutWindow(profile);
}

/** Puts the switches back and shuts the window: the mark in the bar, further out
 *  where a hand is already reaching for Save. */
function revertProfile() {
  drawProfile();
  sayProfile('');
  shutWindow(profile);
}

function buildProfile() {
  accountBar.querySelector('a').addEventListener('click', () => {
    if (profile.classList.contains('open')) shutWindow(profile);
    else {
      drawProfile();
      sayProfile('');
      openWindow(profile, true);
    }
  });

  presetButton.addEventListener('click', () => {
    if (presetPanel.classList.contains('open')) shutWindow(presetPanel);
    else {
      drawPresets();
      sayPresets('');
      openWindow(presetPanel, true);
    }
  });

  document.getElementById('preset-new').addEventListener('click', newPreset);

  document.getElementById('profile-save').addEventListener('click', keepProfile);
  document.getElementById('profile-revert').addEventListener('click', revertProfile);

  for (const box of [wantPresets, wantPrivate]) {
    box.addEventListener('change', () => {
      draftProfile();
      sayProfile('Not kept yet.');
    });
  }

  for (const part of Object.keys(scales)) {
    const slider = document.getElementById(`scale-${part}`);
    slider.value = String(scales[part]);
    // `change` rather than `input`: a range fires `change` when the hand lets
    // go, which is exactly the moment the window may safely resize under it.
    slider.addEventListener('change', () => takeScale(part, Number(slider.value)));
  }
}

/**
 * Which marker pictures exist.
 *
 * Asked once at start and again whenever markers arrive naming one that is not
 * known yet — which is what happens when a mod adding markers is installed while
 * the map is open.
 */
async function pollIcons() {
  try {
    icons = new Set(await (await fetch('/icons.json')).json());
  } catch (error) {
    /* the service may be restarting */
  }
}

/** Players move constantly; markers rarely. Both are cheap to fetch. */
async function pollLive() {
  try {
    const live = await (await fetch('/live.json')).json();
    players = live.Players || [];
    const places = live.Waypoints || [];

    // A marker naming a picture nobody has heard of means the set has grown.
    if (places.some(place => place.Icon && !icons.has(String(place.Icon)))) {
      await pollIcons();
      // The pictures changed, so what is drawn no longer matches what was drawn,
      // and the form's picker is short of one.
      drawnPlaces = null;
      if (composer.classList.contains('open')) drawPictures();
    }

    // The one honest confirmation there is: the marker this page asked for is
    // now among the markers the service is sending, which means the game made it.
    if (awaiting) {
      if (arrived(places)) landed();
      else if (Date.now() - askedAt > MARKER_PATIENCE) await lost();
    }


    drawPlayers();
    drawWho();
    keepUp();
    drawPlaces(places);
    say();
  } catch (error) {
    /* the service may be restarting */
  }
}

/**
 * Watches for terrain that has changed.
 *
 * Asking with `since` gets back the tiles that actually changed rather than a
 * bare "something did", so a server where one person is building repaints one
 * square instead of the map.
 */
async function pollWorld() {
  try {
    const query = generation === 0 ? '' : `?since=${generation}`;
    const info = await (await fetch(`/info.json${query}`, { cache: 'no-store' })).json();
    if (info.generation === generation) return;

    const grew = terrain === null
      || info.levels !== levels
      || info.minX < bounds.minX || info.maxX > bounds.maxX
      || info.minZ < bounds.minZ || info.maxZ > bounds.maxZ;

    generation = info.generation;
    chunks = info.chunks;
    levels = info.levels ?? 0;
    chunkEdge = info.chunk ?? 0;
    spawn = { x: info.spawnX ?? 0, z: info.spawnZ ?? 0 };
    Object.assign(bounds, info);

    // Growing and changing are not the same thing. A world that has grown needs
    // its edges moved, and the tiles that changed still need replacing — usually
    // both at once, since the export that added a region also drew it.
    if (grew) resize();
    if (info.tiles) terrain?.refresh(info.tiles);
    else if (!grew) terrain?.redraw();

    // The block under a resting pointer may be a different block now. What was
    // said about it was true of the map before this export, so it is asked again.
    told = null;
    ask();
    say();
  } catch (error) {
    /* the service may be restarting; try again next time */
  }
}

recall();
applyScales();
buildSettings();
buildCompose();
buildProfile();
pollMe();
for (const setting of Object.values(settings)) setting.apply(setting.on);

setInterval(pollLive, 2000);
setInterval(pollWorld, 5000);
pollWorld().then(pollIcons).then(pollColours).then(pollLive);
</script>
