<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witchlight</title>
<link rel="stylesheet" href="/leaflet.css">
<style>
  /* One set of surfaces, one type scale, one spacing step.
     
     What a utility map needs from its own furniture is that it be legible over
     whatever the terrain happens to be and that it stay out of the way. Three
     rules follow from that and everything below is an application of them.

     Surfaces are layered greys rather than black. Black hides anything dark
     drawn on it — the game's own near-black waypoint colour came out invisible
     in the picker — and it reads as a hole cut in the map rather than a panel
     laid over it. Each step up is a lighter grey: the map, a panel, a panel's
     bar, a field sunk into one.

     Text is measured, not guessed. Body and anything a reader has to take in
     clears 4.5:1 against the surface it sits on, which is the contrast standard
     for text at these sizes; the muted grey used before came to 3.3:1 and was
     the reason small print here was hard going.

     Sizes and gaps come from a scale. Four steps of each, so that two things a
     hair apart cannot happen by accident, and so a panel reads as one thing
     rather than as a collection of separately tuned boxes. */
  :root {
    --bg: #14141a;
    --surface: #1e1e26;
    /* The same grey, laid over the map. Opaque enough to read against any
       terrain under it and not so opaque that a panel hides where it sits. */
    --surface-veil: #1e1e26f2;
    --surface-bar: var(--surface-bar);
    --surface-sunk: #16161d;
    --surface-on: var(--surface-on);
    /* Two weights, because they answer to different rules. A divider between
       parts of a panel is decoration and stays quiet. The edge of a box you
       type into or press is how you find it at all, and clears 3:1 against the
       panel behind it — no fill difference can carry that on a dark theme,
       where the darkest field available is 1.16:1 from the surface. */
    --line: #3a3a47;
    --line-soft: #2c2c37;
    --line-edge: #6e6e88;
    --text: #d6d6de;
    --text-strong: #f0f0f5;
    --text-dim: #9a9aa8;
    --text-off: var(--text-off);
    --accent: var(--accent);
    --accent-soft: var(--accent-soft);
    --warn: var(--warn);

    --font-sm: 11px;
    --font-md: 12px;
    --font-lg: 13px;
    --font-xl: 15px;
    --lead: 1.45;

    --gap-1: 4px;
    --gap-2: 8px;
    --gap-3: 12px;
    --gap-4: 16px;
    --round: 4px;
    --round-sm: 3px;
  }
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #14141a; color: var(--text);
               font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #map { position: absolute; inset: 0; background: #14141a; }
  /* Ground the map has never been given is drawn as a flat #141416 tile; where
     there is no tile at all, this shows through instead. They were within four
     units of each other, so a map with no tiles and a map with nothing on it
     looked identical — which is how a palette that had lost its colours read as
     a map that broke when you zoomed in, three separate times. The hatch is the
     difference: flat means the map has been here and found nothing, striped
     means no tile arrived. Cheap enough to sit under the whole viewport, and it
     costs the stored tiles nothing to change. */
  .leaflet-container {
    background-color: #14141a;
    background-image: repeating-linear-gradient(45deg,
      #191920 0 6px, #14141a 6px 12px);
    outline: none;
  }
  /* One pixel is one block, so a magnified terrain tile must stay blocks and not
     blur. Only the terrain: the grid's lines are drawn at the size they are
     wanted and pixelating them thickens them into a lattice. */
  .terrain .leaflet-tile { image-rendering: pixelated; }
  /* An arrow, not a crosshair. A crosshair centres on what it is naming and so
     covers it, which for a tool whose whole job is looking at one block is the
     one thing it must not do; an arrow's tip is the point and its body lies
     away from it. Against the map's usual grab hand it still reads as a mode. */
  .leaflet-container.picking { cursor: default; }
  #who { position: absolute; right: 12px; top: 12px; z-index: 500; width: 216px;
         max-height: calc(100% - 24px); overflow-y: auto;
         display: flex; flex-direction: column; gap: 6px;
         transform: scale(var(--scale-people)); transform-origin: top right; }
  #who:empty { display: none; }
  .card { display: grid; grid-template-columns: 40px 1fr; gap: 9px;
          align-items: center; padding: 8px 10px;
          background: var(--surface-veil); border: 1px solid var(--line); border-radius: 4px;
          cursor: pointer; }
  .card:hover { border-color: var(--accent-soft); background: var(--surface-bar); }
  .card.followed { border-color: var(--accent); background: var(--surface-on); }
  .card .face { width: 40px; height: 40px; border-radius: 3px; background: var(--surface);
                border: 1px solid var(--line); display: grid; place-items: center;
                font-size: 17px; color: var(--text-off); overflow: hidden; }
  .card .face svg { width: 100%; height: 100%; display: block; }
  /* A portrait is one block per pixel of a rendered seraph, so it is scaled the
     way the terrain is: crisp, rather than smeared into a thumbnail. */
  .card .face img { width: 100%; height: 100%; display: block; object-fit: contain;
                    image-rendering: pixelated; }
  /* A grid column will not shrink below its content unless told it may, and a
     player may call themselves anything, so without this a long name pushes the
     card and its bars out past their own border. */
  .card > div:last-child { min-width: 0; }
  .card .name { color: var(--text-strong); font-size: 12px; margin-bottom: 4px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; border-radius: 3px; background: #ffffff1f; margin-top: 3px;
         overflow: hidden; }
  .bar > i { display: block; height: 100%; }
  .bar.hp > i { background: #e05a5a; }
  .bar.food > i { background: #74a94a; }
  /* How large the page draws itself, in three parts that answer to different
     things: who is online, the windows, and the buttons that work the map.
     Scaled rather than restyled — every one of these is an overlay positioned
     against a corner, so growing one moves nothing else, and a transform keeps
     borders and text crisp at any size without a second set of dimensions. */
  :root { --scale-people: 1; --scale-panel: 1; --scale-tools: 1; }
  /* Which build is serving this page, quiet enough to read past: the only
     question it answers is whether the half someone is looking at is the half
     they just deployed. No box — a shadow keeps it legible over pale terrain
     without putting furniture on the map. */
  #version { position: absolute; right: 12px; bottom: 12px; z-index: 500;
             height: 20px; display: grid; place-items: center;
             font-size: 11px; color: var(--text-dim); pointer-events: none;
             text-shadow: 0 1px 2px var(--surface-veil); }
  #settings { position: absolute; left: 12px; top: 92px; z-index: 900;
              width: 216px; padding: 10px 12px; background: var(--surface-veil);
              border: 1px solid var(--line); border-radius: 4px; display: none;
              transform: scale(var(--scale-panel)); transform-origin: top left; }
  #settings.open { display: block; }
  #settings h2 { margin: 0 0 var(--gap-2); font-size: var(--font-sm);
                 letter-spacing: .09em; text-transform: uppercase;
                 color: var(--text-dim); font-weight: normal; }
  #settings label { display: flex; align-items: center; gap: var(--gap-2);
                    min-height: 24px; padding: var(--gap-1) 0;
                    font-size: var(--font-md); color: var(--text); cursor: pointer; }
  #settings input { accent-color: var(--accent); margin: 0; }
  /* Windows over the map rather than panels beside it: the marker form, the
     presets, and who you are. Each is moved by its bar to wherever it is in the
     way, and each sits over everything Leaflet draws — which tops out at 1000 —
     so nothing it covers has to move out from under it.

     One chrome for all three, because three windows that behave differently are
     three things to learn. What differs between them is where they open and how
     wide they are, which is all any of them says for itself. */
  .window { position: absolute; z-index: 1100; display: none;
            max-height: calc(100% - 24px); overflow-y: auto;
            padding: var(--gap-3) var(--gap-4) var(--gap-4);
            background: var(--surface-veil);
            border: 1px solid var(--line); border-radius: var(--round);
            box-shadow: 0 8px 28px #000000aa;
            font-size: var(--font-md); line-height: var(--lead);
            transform: scale(var(--scale-panel)); transform-origin: top left; }
  .window.open { display: block; }
  /* The bar is the handle. Full bleed against the window's own padding, so what
     can be grabbed is the whole strip and not a word in the middle of it. */
  .window > .bar { display: flex; align-items: center; gap: var(--gap-2);
                   cursor: move;
                   margin: calc(var(--gap-3) * -1) calc(var(--gap-4) * -1) var(--gap-3);
                   padding: var(--gap-2) var(--gap-3);
                   background: var(--surface-bar);
                   border-bottom: 1px solid var(--line);
                   border-radius: var(--round) var(--round) 0 0;
                   user-select: none; touch-action: none; }
  .window > .bar.held { background: var(--surface-bar); }
  .window h2 { margin: 0; flex: 1; font-size: var(--font-sm); letter-spacing: .09em;
               text-transform: uppercase; color: var(--text-dim); font-weight: normal; }
  /* Twenty-four square, the smallest a pointer target should be. The mark
     inside stays small; what grows is the area that answers to a click. */
  .window .shut { flex: none; padding: 0; width: 24px; height: 24px; display: grid;
                  place-items: center; font: inherit; font-size: var(--font-xl);
                  line-height: 1; color: var(--text-dim); cursor: pointer;
                  background: none; border: none; border-radius: var(--round-sm); }
  .window .shut:hover { color: #fff; background: var(--surface-bar); }
  #compose { left: 260px; top: 92px; width: 232px; }
  #presets { left: 300px; top: 130px; width: 340px; }
  #profile { left: 50%; top: 90px; width: 300px; }
  #compose .field { margin-bottom: var(--gap-3); }
  #compose .field > span { display: block; font-size: var(--font-sm);
                           letter-spacing: .07em; text-transform: uppercase;
                           color: var(--text-dim); margin-bottom: var(--gap-1); }
  #compose input[type=text], #compose input[type=number] {
      width: 100%; box-sizing: border-box; padding: 6px var(--gap-2);
      font: inherit; font-size: var(--font-md); color: var(--text-strong);
      background: var(--surface-sunk); border: 1px solid var(--line-edge);
      border-radius: var(--round-sm); }
  #compose input:focus { outline: none; border-color: var(--accent); }
  /* Spinners take a third of a three-across box and nobody nudges a coordinate
     one block at a time. The field is still a number field, for the keyboard a
     phone puts up and for what the browser will accept. */
  #compose input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  #compose input[type=number]::-webkit-outer-spin-button,
  #compose input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  #colours .swatch { width: 18px; height: 18px; border-radius: 3px;
                     border: 1px solid #ffffff2e; cursor: pointer; padding: 0; }
  .swatch.chosen { box-shadow: 0 0 0 2px var(--accent); }
  #pictures { max-height: 108px; overflow-y: auto; padding: 3px;
              background: #14141a; border: 1px solid var(--line); border-radius: 3px; }
  #pictures .swatch { width: 24px; height: 24px; display: grid; place-items: center;
                      border-radius: 3px; cursor: pointer; background: none;
                      border: none; padding: 0; }
  /* Drawn the way the marker itself will be — the silhouette as a mask, filled
     with the colour chosen above it — so the picker shows markers rather than a
     menu of grey shapes, and the choice is made against what it produces. */
  #pictures .swatch i { display: block; width: 17px; height: 17px;
                        -webkit-mask-size: contain; mask-size: contain;
                        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
                        -webkit-mask-position: center; mask-position: center; }
  /* A list of blocks under the box that is being typed into. Positioned against
     the field rather than the window so it follows the box, and over everything
     in the window so a long list is not clipped by the field below it. */
  .finding { position: relative; }
  #block-found { position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
                 max-height: 168px; overflow-y: auto; margin-top: 2px;
                 background: var(--surface-sunk); border: 1px solid var(--line); border-radius: 3px;
                 box-shadow: 0 6px 18px #000000aa; display: none; }
  #block-found.open { display: block; }
  #block-found button { display: block; width: 100%; min-height: 24px;
                        text-align: left; padding: var(--gap-1) var(--gap-2);
                        font: inherit; font-size: var(--font-md); color: var(--text);
                        background: none; border: none; cursor: pointer; }
  #block-found button:hover, #block-found button.on { background: var(--surface-on); color: #fff; }
  #block-found b { display: block; font-weight: normal; color: var(--text-strong); }
  #block-found span { display: block; font-size: var(--font-sm); color: var(--text-dim);
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place { display: grid; grid-template-columns: 1fr 1fr 1fr 28px; gap: 4px; }
  #compose .tool { display: grid; place-items: center; height: 28px; padding: 0;
                   font-size: var(--font-lg); line-height: 1; color: var(--text);
                   cursor: pointer; background: var(--surface-bar);
                   border: 1px solid var(--line-edge); border-radius: var(--round-sm); }
  #compose .tool:hover { border-color: var(--accent-soft); color: #fff; }
  #compose .tool.armed { background: var(--surface-on); box-shadow: inset 0 0 0 2px var(--accent); }
  /* What the form last did, or why it did not. Always present, so the buttons
     under it do not jump when there is something to say. */
  #said { margin: var(--gap-1) 0 var(--gap-3); font-size: var(--font-md);
          line-height: var(--lead); color: var(--text-dim); min-height: 17px; }
  #said.wrong { color: var(--warn); }
  .deed { display: flex; align-items: center; gap: var(--gap-2);
          margin-top: var(--gap-2); }
  #presets .deed { justify-content: flex-end; }
  .deed .keep { display: flex; align-items: center; gap: 5px; margin-left: auto;
                font-size: 12px; color: var(--text); cursor: pointer; }
  .deed input { accent-color: var(--accent); margin: 0; }
  .deed button { min-height: 26px; padding: var(--gap-1) var(--gap-3);
                 font: inherit; font-size: var(--font-md); color: var(--text);
                 cursor: pointer; background: var(--surface-bar);
                 border: 1px solid var(--line-edge); border-radius: var(--round-sm); }
  .deed button:hover { border-color: var(--accent-soft); color: #fff; }
  .deed button.go { color: var(--text-strong); background: var(--surface-on); border-color: var(--accent); }
  .deed button[disabled] { color: var(--line); cursor: default; border-color: var(--line-soft); }
  .deed button[disabled]:hover { color: var(--line); border-color: var(--line-soft); }
  /* A checkbox with a sentence after it, which is what most of a settings body
     is. Its own class rather than a bare label, so the marker form and the
     profile agree about what one looks like. */
  .line { display: flex; align-items: center; gap: var(--gap-2);
          min-height: 24px; padding: var(--gap-1) 0;
          font-size: var(--font-md); color: var(--text); cursor: pointer; }
  .line input { accent-color: var(--accent); margin: 0; flex: none; }
  .line b { color: var(--text-strong); font-weight: normal; }
  .note { margin: 0 0 var(--gap-3); font-size: var(--font-md);
          line-height: var(--lead); color: var(--text-dim); }
  .note code { color: var(--text-dim); }
  .slide { display: grid; grid-template-columns: 88px 1fr; gap: var(--gap-2);
           align-items: center; min-height: 24px; padding: var(--gap-1) 0;
           font-size: var(--font-md); color: var(--text); }
  .slide input { accent-color: var(--accent); width: 100%; margin: 0; }
  /* Whoever is looking, drawn the way the player cards draw one. A portrait is
     one block per pixel, so it is scaled the way the terrain is. */
  #profile .face { width: 28px; height: 28px; flex: none; border-radius: 3px;
                   background: var(--surface); border: 1px solid var(--line);
                   display: grid; place-items: center; overflow: hidden;
                   font-size: 15px; color: var(--text-off); }
  #profile .face img { width: 100%; height: 100%; display: block;
                       object-fit: contain; image-rendering: pixelated; }
  #profile h2 { font-size: 12px; letter-spacing: 0; text-transform: none;
                color: var(--text-strong); overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  #sign-out { margin-left: auto; font-size: 12px; color: var(--text-dim);
              text-decoration: none; }
  #sign-out:hover { color: var(--warn); }
  /* A list of what there is, picked from rather than typed into. Changing one
     opens it in the marker window, which is where every one of these choices is
     already made — a second set of pickers in here would be a second place for
     the same choice to look different. */
  .preset { display: grid; grid-template-columns: 22px 1fr auto; gap: 7px;
            align-items: center; }
  .preset .pick { display: contents; }
  .preset .mark { width: 22px; height: 22px; display: grid; place-items: center; }
  .preset .mark i { display: block; width: 16px; height: 16px;
                    -webkit-mask-size: contain; mask-size: contain;
                    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
                    -webkit-mask-position: center; mask-position: center; }
  .preset .said { min-width: 0; text-align: left; background: none; border: none;
                  padding: 5px 0; font: inherit; color: var(--text); cursor: pointer; }
  .preset .said b { display: block; color: var(--text-strong); font-weight: normal;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset .said span { display: block; font-size: 11px; color: var(--text-dim);
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset:hover .said b { color: var(--accent); }
  .preset.chosen { background: var(--surface-on); box-shadow: inset 0 0 0 1px var(--accent-soft);
                   border-radius: 3px; }
  #preset-list { display: flex; flex-direction: column; }
  #preset-list:empty::after { content: 'No presets yet. Tick "set as preset" when you save a marker.';
                              display: block; font-size: 11px; color: var(--text-dim);
                              padding: 4px 0 10px; }
  #profile-said { margin: var(--gap-2) 0 var(--gap-3); font-size: var(--font-md);
                  color: var(--text-dim); min-height: 17px; }
  #profile-said.wrong { color: var(--warn); }
  #preset-said { margin: var(--gap-2) 0 var(--gap-3); font-size: var(--font-md);
                 color: var(--text-dim); min-height: 17px; }
  #preset-said.wrong { color: var(--warn); }
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 500;
         padding: 7px 11px; background: var(--surface-veil); border: 1px solid var(--line);
         border-radius: 4px; pointer-events: none; white-space: pre; }
  /* What the picker is on, under where the pointer is. Nothing to say is no
     line at all, rather than a gap that moves the corner about. */
  #what { color: var(--text-dim); margin-top: 5px; }
  #what:empty { display: none; }
  .player, .marker { background: none; border: none; }
  .pin { display: block; width: 10px; height: 10px; margin: -5px 0 0 -5px;
         border: 2px solid var(--surface-veil); border-radius: 50%; background: var(--accent); }
  .diamond { display: block; width: 11px; height: 11px; margin: -6px 0 0 -6px;
             border: 1.5px solid #000000aa; transform: rotate(45deg); }
  /* The game's own marker pictures are single colour silhouettes, so they are
     used as a mask and filled with the colour their owner chose — the same way
     the game draws them. A drop shadow stands in for an outline, since a mask
     has no edge of its own to stroke. */
  .icon { display: block; width: 18px; height: 18px; margin: -9px 0 0 -9px;
          -webkit-mask-size: contain; mask-size: contain;
          -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
          -webkit-mask-position: center; mask-position: center;
          filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #000a); }
  body.no-names .tag { display: none; }
  /* A marker's name is off by default and worn permanently when it is on: a map
     with forty markers on it is forty labels, which is a map you cannot see. */
  .marker .tag { display: none; color: var(--text-strong); bottom: 11px; }
  body.show-marker-names .marker .tag { display: block; }
  .tag { position: absolute; left: 50%; transform: translateX(-50%);
         bottom: 9px; white-space: nowrap; font-size: 11px; color: var(--accent);
         text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }
  /* What a marker says about itself.

     It used to be one run of text with line breaks in it, which put the name,
     the owner and three coordinates at one size in one block — everything
     speaking equally loudly, which is the same as nothing being findable. It is
     a record now: the name is the heading, and what is true of it sits under a
     rule at a size that says so. */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--line); }
  .leaflet-popup-content-wrapper { border-radius: var(--round);
      box-shadow: 0 8px 28px #000000aa; }
  .leaflet-popup-content { margin: 0; min-width: 176px;
      font: var(--font-md)/var(--lead) ui-monospace, SFMono-Regular, Menlo, monospace; }
  .leaflet-popup-close-button { color: var(--text-dim) !important;
      padding: var(--gap-2) var(--gap-2) 0 0 !important; }
  .leaflet-popup-close-button:hover { color: var(--text-strong) !important; }
  .said-name { display: block; font-weight: normal; font-size: var(--font-lg);
               line-height: 1.3; color: var(--text-strong);
               padding: var(--gap-3) 28px var(--gap-2) var(--gap-3); }
  .said-keep { margin-left: var(--gap-2); font-size: var(--font-sm);
               color: var(--text-dim); }
  /* A footer under a rule, read left to right: where it is, then whose it is.
     Both are what somebody checks after the name rather than while reading it.

     The coordinates hold their width and the name gives way, because a place is
     read digit by digit and a name that has run out of room still says who. */
  .said-foot { display: flex; align-items: baseline; justify-content: space-between;
               gap: var(--gap-3);
               padding: var(--gap-2) var(--gap-3) var(--gap-3);
               border-top: 1px solid var(--line-soft);
               font-size: var(--font-sm); color: var(--text-dim); }
  .said-where { flex: none; letter-spacing: .02em; }
  .said-who { min-width: 0; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .leaflet-bar a { background: var(--surface); color: var(--text); border-bottom-color: var(--line); }
  .leaflet-bar a:hover { background: var(--surface-bar); color: #fff; }
  /* Centred by the grid rather than by a line height, which is what the cog in
     the other corner does and the only thing that centres a glyph reliably. */
  .leaflet-bar a.tool { display: grid; place-items: center; font-size: 15px;
                        line-height: 1; }
  /* A tool that is on has to look on. A ring rather than a colour: the mark is
     an emoji and paints itself, so `color` says nothing about it. */
  .leaflet-bar a.tool.armed { background: var(--surface-on);
                              box-shadow: inset 0 0 0 2px var(--accent); }
  /* Two columns down the left edge, because they answer to different things.
     What moves the map hangs from the middle, where a hand reaches for it and
     where there is room either side of it to grow. Who you are sits in the
     corner, out of the way of the map and where a page puts an account. */
  .leaflet-top.leaflet-left { top: 50%;
      transform: translateY(-50%) scale(var(--scale-tools));
      transform-origin: left center; }
  #corner { position: absolute; left: 10px; top: 10px; z-index: 800;
            transform: scale(var(--scale-tools)); transform-origin: top left; }
  /* The settings and who you are, side by side at the top of the column: one is
     about the map and one is about you, and neither is the other's heading. */
  #row { display: flex; gap: 6px; align-items: flex-start; }
  #row .leaflet-bar { margin: 0; }

  /* Who is looking. Wider than a map control because a name is wider than a
     glyph, and left aligned with the rest of the column. */
  /* Flex, not the grid every other tool button uses. A grid with two things in
     it gives each its own row, which stacked the mark on top of the name — and
     `place-items` centring both is exactly what hid that it was two rows. */
  #account a { display: flex; align-items: center; width: auto; min-width: 26px;
               max-width: 190px; padding: 0 9px 0 7px; justify-content: start;
               font-size: 12px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  /* Nobody has followed a link yet. Still a button, so the shape of the page
     does not move when somebody logs in, but plainly not offering anything. */
  #account a.out { color: var(--text-dim); cursor: default; }
  #account a.out:hover { background: var(--surface); color: var(--text-dim); }
  /* Leaflet spaces and shrink-wraps its own bars; these are not its, so they say
     both for themselves. Without the width a bar fills the column and the narrow
     button in it sits in a wide box.

     One clear button's height between the account and whatever it gates, so the
     two read as different things rather than one column of controls. Written at
     the same weight as the reset above it, or the reset wins and they touch. */
  #corner .leaflet-bar { margin: 0; width: max-content; }
  #corner #row { margin-bottom: 26px; }
  /* A mark for whoever is looking, so the button reads as a person and not as a
     word. Placeholder: the game draws a portrait of each player and that is what
     belongs here, once the map can name one for somebody who is offline. */
  #account a::before { content: '\1F464'; flex: none; margin-right: 8px;
                       padding-right: 8px; border-right: 1px solid var(--line);
                       opacity: .75; }
  /* Shown only to somebody who can act on them — see `showAccount`. Both are
     about markers you own, and owning anything means the game named you. */
  #mine { display: none; }
  #mine.on { display: block; }

  .leaflet-control-attribution { display: none; }
</style>

<script>
const TILE = __TILE__;
const bounds = { minX: __MIN_X__, minZ: __MIN_Z__, maxX: __MAX_X__, maxZ: __MAX_Z__ };

/**
 * Where the game counts from.
 *
 * Vintage Story shows every coordinate a player sees relative to world spawn,
 * while the world itself is a million blocks across with spawn near the middle.
 * Showing absolute positions is not wrong, but it agrees with nothing the player
 * can compare it against, which comes to the same thing.
 */
let spawn = { x: 0, z: 0 };

/** A world position as the game would say it. */
const said = (x, z) => settings.absolute.on
  ? [Math.round(x), Math.round(z)]
  : [Math.round(x - spawn.x), Math.round(z - spawn.z)];

/** How far past one block per pixel the view may go. Costs no extra tiles: Leaflet
 *  stretches the finest level rather than asking for one that does not exist. */
const ZOOM_IN_BEYOND_NATIVE = 3;

/**
 * The Leaflet zoom at which one pixel is one block, fixed once and never moved.
 *
 * It would be tempting to put the finest level at whatever zoom the world happens
 * to need today, but the world grows: a player walking far enough adds a level,
 * and everything would shift underneath. Pinning it means growth only ever
 * changes how far out the view may go, which is one call and no teardown.
 *
 * Sixteen is 65,536 blocks to a pixel at the coarsest — past any world.
 */
const NATIVE_ZOOM = 16;

/** A world block position as Leaflet sees it. Latitude is Z, longitude is X. */
const at = (x, z) => L.latLng(z, x);

/**
 * Pixels per block at a Leaflet zoom, given which zoom is the finest level.
 *
 * One at the finest, halving for every level out. Leaflet counts zoom upward as
 * detail grows and the levels are numbered from the finest downward, so this and
 * `levelFor` are the whole of the translation between the two.
 */
function scaleAt(zoom, native) {
  return Math.pow(2, zoom - native);
}

/** Which stored level a Leaflet zoom asks for. Never past the finest there is. */
function levelFor(zoom, native) {
  return Math.max(0, native - zoom);
}

/** The zoom that draws this many pixels per block. The inverse of `scaleAt`. */
function zoomFor(perBlock, native) {
  return native + Math.log(perBlock) / Math.LN2;
}

/** How Leaflet names a tile it is holding, for replacing one in place. */
function tileKey(level, x, z, native) {
  return `${x}:${z}:${native - level}`;
}

/** How few pixels a chunk may be across before its grid is a wash, not a grid. */
const GRID_MIN_PIXELS = 8;

/**
 * The coarsest zoom at which the chunk grid is still worth drawing.
 *
 * Told to Leaflet as the grid layer's own minimum, so zooming out past it stops
 * the tiles being asked for rather than drawing sixteen empty canvases per
 * screen. A chunk edge of 32 puts the floor two levels above the finest.
 */
function gridFloor(chunk, native) {
  return native + Math.log(GRID_MIN_PIXELS / chunk) / Math.LN2;
}

let generation = 0;
let levels = 0;
let chunks = 0;
/** Blocks along a chunk's edge, which is what the grid is drawn on. */
let chunkEdge = 0;
let players = [];
/** Marker pictures the service has. A name not in here gets a plain shape. */
let icons = new Set();


const hudWhere = document.getElementById('where');
const hudWhat = document.getElementById('what');
const who = document.getElementById('who');

/**
 * What the reader has chosen to see.
 *
 * Kept in the browser rather than on the server: these are one person's
 * preferences about one screen, and everybody looking at the same map is
 * entitled to a different answer.
 */
const settings = {
  players: { label: 'Players', on: true, apply: on => layer(people, on) },
  markers: { label: 'Markers', on: true, apply: on => layer(places, on) },
  grid: { label: 'Chunk grid', on: false, apply: on => layer(grid, on) },
  panel: { label: 'Player list', on: true, apply: on => { who.style.display = on ? '' : 'none'; } },
  absolute: { label: 'Absolute coordinates', on: false, apply: () => { say(); reframe(); } },
  names: { label: 'Player names', on: true, apply: on => {
    document.body.classList.toggle('no-names', !on);
  } },
  markerNames: { label: 'Marker names', on: false, apply: on => {
    document.body.classList.toggle('show-marker-names', on);
  } },
  hover: { label: 'Marker info on hover', on: false, apply: () => {} },
};

/**
 * How large the page draws itself, in three parts.
 *
 * Kept beside the other view settings and for the same reason: this is one
 * person's answer about one screen, and the same person on a phone wants a
 * different one. What follows them between machines is what they set about
 * markers, which lives on the service against their uid.
 */
const scales = { people: 1, panel: 1, tools: 1 };

function applyScales() {
  for (const [part, size] of Object.entries(scales)) {
    document.documentElement.style.setProperty(`--scale-${part}`, String(size));
  }
}

function layer(group, on) {
  // A layer the map has not built yet — the grid, before anything is exported —
  // is nothing to show and nothing to hide.
  if (!group) return;
  if (on) {
    if (!map.hasLayer(group)) map.addLayer(group);
  } else if (map.hasLayer(group)) {
    map.removeLayer(group);
  }
}

function buildSettings() {
  const panel = document.getElementById('settings');
  for (const [key, setting] of Object.entries(settings)) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = setting.on;
    box.addEventListener('change', () => {
      setting.on = box.checked;
      remember();
      setting.apply(box.checked);
    });
    label.append(box, document.createTextNode(setting.label));
    panel.append(label);
  }

  cogBar.querySelector('a').addEventListener('click', event => {
    event.stopPropagation();
    panel.classList.toggle('open');
  });
  // Anywhere else closes it, including the map underneath.
  addEventListener('click', () => panel.classList.remove('open'));
  panel.addEventListener('click', event => event.stopPropagation());
}

/** Choices survive a reload; a browser that refuses to remember is not an error. */
function remember() {
  try {
    const state = { scales };
    for (const [key, setting] of Object.entries(settings)) state[key] = setting.on;
    localStorage.setItem('witchlight.settings', JSON.stringify(state));
  } catch (error) {
    /* private windows and cleared storage are allowed to say no */
  }
}

function recall() {
  try {
    const state = JSON.parse(localStorage.getItem('witchlight.settings') || '{}');
    for (const [key, setting] of Object.entries(settings)) {
      if (typeof state[key] === 'boolean') setting.on = state[key];
    }
    for (const part of Object.keys(scales)) {
      const size = Number(state.scales && state.scales[part]);
      // Bounded on the way in as well as on the slider: what is stored here came
      // from a browser and a page drawn at a hundredth of size cannot be reached
      // to put right.
      if (Number.isFinite(size) && size >= 0.7 && size <= 1.8) scales[part] = size;
    }
  } catch (error) {
    /* whatever was stored is not usable, so the defaults stand */
  }
}

/**
 * Blocks rather than degrees, and north stays up.
 *
 * `CRS.Simple` halves the scale for every zoom level down from zero; this shifts
 * that so the scale is one to one at the finest level instead, which is where one
 * pixel is one block. The transformation drops the vertical flip `Simple` applies,
 * because world Z already grows downward in a tile.
 */
function blockCrs(native) {
  return L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(1, 0, 1, 0),
    scale: zoom => scaleAt(zoom, native),
    zoom: scale => Math.log(scale) / Math.LN2 + native,
  });
}

/**
 * The terrain, at whichever level suits the zoom.
 *
 * Leaflet counts zoom upward as detail grows; the levels are numbered from the
 * finest, so that a world getting bigger adds numbers rather than renaming every
 * tile already written. The two meet here and nowhere else.
 */
const Terrain = L.TileLayer.extend({
  getTileUrl(coords) {
    const level = levelFor(coords.z, this.options.maxNativeZoom);
    return `/tiles/${level}/${coords.x}/${coords.y}.png?v=${generation}`;
  },

  /**
   * Refetches only the tiles named, leaving the rest of the map alone.
   *
   * `redraw()` would throw away every tile and ask again for all of them, which
   * for one person building a wall is hundreds of tiles to redraw one. The
   * service says exactly which tiles changed, so only those are replaced — and
   * each is swapped once its replacement has decoded, so nothing blinks.
   */
  refresh(changed) {
    for (const [level, x, z] of changed) {
      const key = tileKey(level, x, z, this.options.maxNativeZoom);
      const held = this._tiles && this._tiles[key];
      if (!held || !held.el) continue;

      const next = new Image();
      next.onload = () => { held.el.src = next.src; };
      next.src = `/tiles/${level}/${x}/${z}.png?v=${generation}`;
    }
  },
});

/** Soft enough to read the terrain through, strong enough to count squares by. */
const GRID_COLOUR = '#ffffff26';

/**
 * Where a tile's chunk lines fall, in pixels across it.
 *
 * The tile begins at world block `start` and covers `blocks` of them, so its
 * lines are the multiples of a chunk edge inside that. A tile draws the line on
 * its own left edge and not the one on its right, which is what keeps the seam
 * between two tiles one line rather than two laid on each other.
 */
function chunkLines(start, blocks, chunk, scale) {
  const places = [];
  for (let block = Math.ceil(start / chunk) * chunk; block < start + blocks; block += chunk) {
    // Half a pixel, so a one pixel line lands on a pixel rather than across two.
    places.push(Math.round((block - start) * scale) + 0.5);
  }
  return places;
}

/**
 * The chunk grid, drawn the way a minimap draws one: faint, square, and only
 * while a chunk is still large enough on screen to be worth outlining.
 *
 * A tile layer rather than an overlay, so it pans and zooms with the terrain by
 * construction and its lines land on the same pixels the tiles do — an overlay
 * would have to be repositioned by hand on every frame and would drift on
 * fractional zoom, which is exactly where a grid being one pixel out shows.
 */
const Grid = L.GridLayer.extend({
  createTile(coords) {
    const canvas = document.createElement('canvas');
    const size = this.getTileSize();
    // Leaflet sizes the element; the canvas is given the device's own pixels so
    // that a one pixel line is one pixel rather than a smear on a dense screen.
    const ratio = window.devicePixelRatio || 1;
    canvas.width = size.x * ratio;
    canvas.height = size.y * ratio;

    const scale = scaleAt(coords.z, NATIVE_ZOOM);
    const context = canvas.getContext('2d');
    context.scale(ratio, ratio);
    context.strokeStyle = GRID_COLOUR;
    context.lineWidth = 1;
    context.beginPath();

    // A tile at this zoom covers this many blocks, so its own left and top edges
    // are these world coordinates.
    const blocks = size.x / scale;

    for (const x of chunkLines(coords.x * blocks, blocks, chunkEdge, scale)) {
      context.moveTo(x, 0);
      context.lineTo(x, size.y);
    }
    for (const z of chunkLines(coords.y * blocks, blocks, chunkEdge, scale)) {
      context.moveTo(0, z);
      context.lineTo(size.x, z);
    }
    context.stroke();
    return canvas;
  },
});

const map = L.map('map', {
  crs: blockCrs(NATIVE_ZOOM),
  attributionControl: false,
  zoomControl: true,
  zoomSnap: 0,
  // Slack enough to move past what has been drawn, and a soft edge rather than
  // a wall at the far end of it.
  maxBoundsViscosity: 0.2,
});

let terrain = null;
let grid = null;

// Between the terrain and everything drawn on top of it. Leaflet puts tiles at
// 200 and overlays at 400, and a grid under the terrain is a grid nobody sees.
map.createPane('grid');
map.getPane('grid').style.zIndex = 250;
map.getPane('grid').style.pointerEvents = 'none';

/**
 * Follows the world as it grows.
 *
 * Called on every export that adds anything, which while somebody is exploring is
 * most of them, so it must not disturb what is on screen. Nothing is torn down and
 * the view is never moved: the layer keeps its tiles, and only the edges of what
 * may be asked for move outward.
 */
function resize() {
  // Nothing exported yet. Every server is here for a moment after a format change
  // clears the map, and a viewer that threw would look like the upgrade failed.
  if (bounds.maxX <= bounds.minX || bounds.maxZ <= bounds.minZ) {
    hudWhere.textContent = 'waiting for the server to export';
    return;
  }

  const world = L.latLngBounds(at(bounds.minX, bounds.minZ), at(bounds.maxX, bounds.maxZ));
  const first = terrain === null;

  // A world's own size of slack on every side. What has been drawn used to be
  // pinned against the edges of the screen, which at a distance is the one time
  // you want to push it aside and look at where it sits.
  map.setMaxBounds(world.pad(1));
  // Only how far out may change. One pixel per block stays at NATIVE_ZOOM
  // whatever the world does, so nothing already drawn moves.
  map.setMinZoom(NATIVE_ZOOM - levels);
  map.setMaxZoom(NATIVE_ZOOM + ZOOM_IN_BEYOND_NATIVE);

  if (first) {
    terrain = new Terrain('', {
      tileSize: TILE,
      minNativeZoom: NATIVE_ZOOM - levels,
      maxNativeZoom: NATIVE_ZOOM,
      // Without this Leaflet asks for tiles across an infinite plane: `CRS.Simple`
      // has no edges of its own, and most of a zoomed out view is world nobody
      // has ever been to.
      bounds: world,
      // Stated, not inherited. A tile layer defaults to a maximum zoom of 18,
      // and that limit is tested against the map's own zoom before it is clamped
      // to the finest level — so zooming past 18 dropped every tile and left the
      // page black, at exactly the magnification `maxNativeZoom` exists to serve.
      minZoom: 0,
      maxZoom: NATIVE_ZOOM + ZOOM_IN_BEYOND_NATIVE,
      // A tile the service has not built answers 404. Without something to put
      // there the browser draws a broken image, which on a world explored in an
      // awkward shape is a grid of them.
      errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
      noWrap: true,
      keepBuffer: 2,
      updateWhenZooming: false,
      className: 'terrain',
    }).addTo(map);

    // Deliberately unbounded, unlike the terrain: a chunk nobody has been to is
    // still a chunk, and seeing where the explored area stops squarely is half
    // of what a grid is for.
    grid = new Grid({
      tileSize: TILE,
      minZoom: gridFloor(chunkEdge, NATIVE_ZOOM),
      maxZoom: NATIVE_ZOOM + ZOOM_IN_BEYOND_NATIVE,
      pane: 'grid',
      className: 'grid',
      noWrap: true,
      updateWhenZooming: false,
    });
    settings.grid.apply(settings.grid.on);

    // A link to a particular view wins over fitting the world, so that opening
    // one lands where it says rather than somewhere else for a moment first.
    const asked = readAddress();
    if (asked) map.setView(at(asked.x, asked.z), asked.zoom);
    else map.fitBounds(world);
    return;
  }

  // The layer reads both of these when it decides what to ask for next, so a
  // world that has grown is picked up without touching a tile already drawn.
  terrain.options.bounds = world;
  terrain.options.minNativeZoom = NATIVE_ZOOM - levels;
}

/**
 * Where the map is, in the address bar.
 *
 * `#x,z,px-per-block` — the same three numbers the corner shows, so a link says
 * what it points at and someone can read one without following it. It is also the
 * only way to ask for a particular view from outside the page, which is what makes
 * the zoom levels testable at all.
 */
function readAddress() {
  const found = location.hash.match(/^#(-?\d+),(-?\d+),([\d.]+)$/);
  if (!found) return null;
  const perBlock = Number(found[3]);
  if (!(perBlock > 0)) return null;
  return { x: Number(found[1]), z: Number(found[2]), zoom: zoomFor(perBlock, NATIVE_ZOOM) };
}

function writeAddress() {
  if (!terrain) return;
  const centre = map.getCenter();
  const perBlock = scaleAt(map.getZoom(), NATIVE_ZOOM).toFixed(2);
  // Replace rather than push: panning a map should not fill the back button.
  history.replaceState(null, '', `#${Math.round(centre.lng)},${Math.round(centre.lat)},${perBlock}`);
}

const people = L.layerGroup().addTo(map);
const places = L.layerGroup().addTo(map);

/** Players on the map, by the identity that survives a rename. */
const drawnPlayers = new Map();

/**
 * Moves the players who moved.
 *
 * Everything here used to be cleared and rebuilt on every poll, which at forty
 * markers and a picture each was forty elements destroyed and recreated every two
 * seconds — a map that flickered twice a minute for every minute it was open.
 * A player who is still online keeps the marker they had and is moved to where
 * they are now.
 */
function drawPlayers() {
  const seen = new Set();

  for (const player of players) {
    const uid = String(player.Uid || player.Name);
    seen.add(uid);

    const drawn = drawnPlayers.get(uid);
    if (drawn) {
      drawn.marker.setLatLng(at(player.X, player.Z));
      // Only the parts that can change: the popup carries their position.
      drawn.marker.setPopupContent(popupFor(player));
      continue;
    }

    const marker = L.marker(at(player.X, player.Z), {
      icon: L.divIcon({
        className: 'player',
        html: `<i class="pin"></i><span class="tag">${escaped(player.Name)}</span>`,
      }),
      // Above markers: a player is the thing that is moving.
      zIndexOffset: 1000,
    })
      .bindPopup(popupFor(player))
      .addTo(people);
    drawnPlayers.set(uid, { marker });
  }

  for (const [uid, drawn] of drawnPlayers) {
    if (!seen.has(uid)) {
      people.removeLayer(drawn.marker);
      drawnPlayers.delete(uid);
    }
  }
}

/** What the markers looked like last time, so an unchanged set is left alone. */
let drawnPlaces = null;

/**
 * Draws the markers, when they are not the ones already drawn.
 *
 * Markers change a few times an hour and arrive every two seconds. Rebuilding
 * them on arrival meant tearing down every marker on the map to discover that
 * none of them had moved.
 */
function drawPlaces(waypoints) {
  const shape = JSON.stringify(waypoints);
  if (shape === drawnPlaces) {
    return;
  }
  drawnPlaces = shape;

  // Every marker is about to be replaced, including whichever one a hover had
  // opened; a wait to close a marker that no longer exists closes nothing.
  forgetHovered();
  places.clearLayers();
  for (const place of waypoints) {
    const colour = /^#[0-9a-f]{6}$/i.test(place.Color || '') ? place.Color : '#ffffff';
    const name = String(place.Icon || '');
    const shape = icons.has(name)
      ? `<i class="icon" style="background:${colour};` +
        `-webkit-mask-image:url(/icons/${encodeURIComponent(name)}.svg);` +
        `mask-image:url(/icons/${encodeURIComponent(name)}.svg)"></i>`
      : `<i class="diamond" style="background:${colour}"></i>`;
    // Every death marker is titled "You died here", so the owner is the only
    // thing that says whose it is. A marker only its owner is sent says so as
    // well: somebody who ticked the box should be able to see that it took.
    const owner = place.Owner ? `<span class="said-who">${escaped(place.Owner)}</span>` : '';
    const kept = place.Private ? '<span class="said-keep">private</span>' : '';
    const label = `<span class="tag">${escaped(place.Title || 'marker')}</span>`;
    const drawn = L.marker(at(place.X, place.Z), {
      icon: L.divIcon({ className: 'marker', html: shape + label }),
    })
      .bindPopup(
        `<b class="said-name">${escaped(place.Title || 'marker')}${kept}</b>` +
        `<span class="said-foot">` +
        `<span class="said-where">${said(place.X, place.Z)[0]}, ${place.Y}, ` +
        `${said(place.X, place.Z)[1]}</span>${owner}</span>`)
      .addTo(places);

    // Reading a marker without clicking it, for somebody who has asked for that.
    // The setting is read at the moment of the hover rather than wired in when
    // the marker is drawn, so turning it on reaches the markers already on the
    // map instead of only the next set to arrive.
    drawn.on('mouseover', () => {
      if (!settings.hover.on) return;
      keepHovered();
      hovered = drawn;
      drawn.openPopup();
      linger(drawn);
    });
    drawn.on('mouseout', () => {
      if (hovered === drawn) closeHovered();
    });
    // A marker opened on purpose stays open. Only what a hover put up comes down
    // on its own, and a click is not a hover however it started.
    drawn.on('click', forgetHovered);

    // A right click on a marker opens it rather than opening a new one on top of
    // it. Offered only to somebody who may change it — see `mayEdit`, and the
    // mod, which decides it again for real.
    drawn.on('contextmenu', event => {
      L.DomEvent.preventDefault(event.originalEvent);
      L.DomEvent.stopPropagation(event);
      if (mayEdit(place)) editCompose(place);
    });
  }
}

/**
 * Lets the box a hover opened be read.
 *
 * Moving onto the box is not moving away from the marker, but as far as the
 * marker is concerned it is — so the box cancels the wait while a pointer is on
 * it and starts it again on the way out. Wired once per element: Leaflet builds
 * a fresh one on each open, and a box that is somehow reused must not collect a
 * listener every time it is looked at.
 */
function linger(marker) {
  const popup = marker.getPopup();
  const box = popup && popup.getElement && popup.getElement();
  if (!box || box.dataset.linger) return;
  box.dataset.linger = 'yes';
  box.addEventListener('mouseenter', keepHovered);
  box.addEventListener('mouseleave', closeHovered);
}

/** Cards on the panel, by the player they stand for. */
const cards = new Map();

/** Whose view the map is keeping, if anyone's. */
let following = null;

/**
 * Keeps the map on one player until somebody drags it.
 *
 * Zooming does not stop it: changing how close you are looking is not the same as
 * choosing to look somewhere else. Dragging is, so that ends it — and so does
 * clicking the same player again.
 */
function follow(uid) {
  following = following === uid ? null : uid;
  for (const [id, card] of cards) {
    card.element.classList.toggle('followed', id === following);
  }
  keepUp();
}

function keepUp() {
  if (following === null) {
    return;
  }
  const player = players.find(p => String(p.Uid || p.Name) === following);
  if (player) {
    map.panTo(at(player.X, player.Z), { animate: true, duration: 0.4 });
  }
}

/**
 * Who is online, down the right hand side.
 *
 * Health and food come from the server, which already knows them, so nothing is
 * asked of anyone to show them. Clicking a card follows that player until the map
 * is dragged.
 *
 * Nothing here is rebuilt. Cards are made once and then written into, so the
 * panel keeping up with the world never disturbs what is on the screen.
 */
function drawWho() {
  const seen = new Set();

  for (const player of players) {
    const uid = String(player.Uid || player.Name);
    seen.add(uid);
    patchCard(cards.get(uid) || newCard(uid), player);
  }

  for (const [uid, card] of cards) {
    if (!seen.has(uid)) {
      card.element.remove();
      cards.delete(uid);
      if (following === uid) following = null;
    }
  }
}

/** A card, built once. What changes on it afterwards is set, not rebuilt. */
function newCard(uid) {
  const element = document.createElement('div');
  element.className = 'card';

  const face = document.createElement('div');
  face.className = 'face';
  const about = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'name';
  const hp = bar('hp');
  const food = bar('food');
  about.append(name, hp.wrap, food.wrap);
  element.append(face, about);
  element.addEventListener('click', () => follow(uid));
  who.append(element);

  const card = { element, face, name, hp, food, look: null, named: null };
  cards.set(uid, card);
  return card;
}

/**
 * Brings one card up to date.
 *
 * Every field is compared before it is written. The panel shares the two second
 * beat the map data arrives on, and a player who is walking changes their
 * position and their food on every one of them — so rebuilding a card whenever
 * anything about its player moved meant rebuilding all of them, always. Setting a
 * width does not disturb the screen; replacing an element does.
 */
function patchCard(card, player) {
  if (card.named !== player.Name) {
    card.named = player.Name;
    card.name.textContent = player.Name;
  }

  const look = `${portraitSrc(player)}|${player.Name}`;
  if (card.look !== look) {
    card.look = look;
    card.face.textContent = '';
    card.face.append(portrait(player));
  }

  fill(card.hp, 'health', player.Health, player.MaxHealth);
  fill(card.food, 'food', player.Saturation, player.MaxSaturation);

  const [x, z] = said(player.X, player.Z);
  const title = `${player.Name} — ${x}, ${player.Y}, ${z}`;
  if (card.element.title !== title) {
    card.element.title = title;
  }
}

/**
 * Where a player's picture is, or the empty string where they have sent none.
 *
 * The address carries when the picture was drawn, because the name cannot: a
 * portrait is filed under its player, so a player who sends a new one keeps the
 * name they had. An address that never changes is one a browser is entitled to go
 * on using, and a card comparing names alone has no way to notice that the picture
 * behind one has been replaced — which is why a new portrait used to need the page
 * reloading before it showed.
 *
 * The whole address is the thing to compare, so this is what the card's own
 * comparison uses too rather than a second reading of the same two fields.
 */
function portraitSrc(player) {
  if (!player.Portrait) {
    return '';
  }
  return `/portraits/${encodeURIComponent(player.Portrait)}.png?v=${player.PortraitAt || 0}`;
}

/**
 * What goes in a player's card.
 *
 * A picture their own client drew of them where there is one, and their initial
 * where there is not. There is nothing in between worth drawing: what a seraph
 * looks like exists only on the machine rendering it, and everything the server
 * can read about an appearance amounts to less than a letter does.
 */
function portrait(player) {
  // A picture the player's own client drew of them, which is the only place a
  // seraph's real appearance exists: its skin parts are textures a dedicated
  // server does not ship, and its clothes and armour are a rendered scene rather
  // than a list of colours.
  const src = portraitSrc(player);
  if (src) {
    const sent = document.createElement('img');
    sent.src = src;
    sent.alt = '';
    // A picture that will not load leaves a broken image in the card, which reads
    // worse than the letter it stands in for.
    sent.addEventListener('error', () => {
      const box = sent.parentElement;
      if (!box) return;
      sent.remove();
      box.append(initial(player));
    }, { once: true });
    return sent;
  }

  return initial(player);
}

/**
 * A player's initial, for anyone who has not sent a picture of themselves.
 *
 * The map used to assemble a face here out of the three colours a server can read
 * off a player — skin, hair, eyes. It was a guess at a likeness and looked like
 * one. A letter says exactly as much as the map actually knows.
 */
function initial(player) {
  const letter = document.createElement('span');
  letter.textContent = (player.Name || '?').trim().charAt(0).toUpperCase() || '?';
  return letter;
}


/** An empty bar, to be filled in later. */
function bar(kind) {
  const wrap = document.createElement('div');
  wrap.className = `bar ${kind}`;
  const inner = document.createElement('i');
  wrap.append(inner);
  return { wrap, inner, at: null };
}

/** A reading, written only when it is not the reading already there. */
function fill(bar, what, value, most) {
  const share = most > 0 ? Math.max(0, Math.min(1, value / most)) : 0;
  const width = `${(share * 100).toFixed(1)}%`;
  if (bar.at === width) {
    return;
  }
  bar.at = width;
  bar.inner.style.width = width;
  bar.wrap.title = most > 0 ? `${what} ${Math.round(value)} of ${Math.round(most)}` : '';
}

function popupFor(player) {
  const [x, z] = said(player.X, player.Z);
  return `<b>${escaped(player.Name)}</b><br>${x}, ${player.Y}, ${z}`;
}

/** Titles and names come from players, so they are text and never markup. */
function escaped(text) {
  const node = document.createElement('span');
  node.textContent = text ?? '';
  return node.innerHTML;
}

/** Where the pointer is, when it is over the map. */
let pointer = null;


/**
 * The picker: a cursor for reading one block, rather than looking at all of them.
 *
 * At one pixel per block the pointer covers whatever it is over, so the point of
 * the tool is not the fetching but the outline — being told which block the map
 * thinks you mean before it tells you what is on it.
 */
let picking = false;
/** The block the outline is on. */
let picked = null;
/** What the service last said, and about which block. */
let told = null;
/** One request at a time; a pointer crossing a hundred blocks asks about the one
 *  it stopped on rather than all hundred. */
let asking = false;

/** What the tool is marked with. An emoji, so it is a picture on every machine
 *  without a drawing to keep aligned inside a 26 pixel square. */
const TOOL_MARK = '🔍';

const Picker = L.Control.extend({
  options: { position: 'topleft' },

  onAdd() {
    const bar = L.DomUtil.create('div', 'leaflet-bar');
    const button = L.DomUtil.create('a', 'tool', bar);
    button.href = '#';
    button.title = 'Inspect a block';
    button.setAttribute('role', 'button');
    // Named, so that a screen reader and a test can both say which control this
    // is among the three identical squares in the corner.
    button.setAttribute('aria-label', 'Inspect a block');
    button.setAttribute('aria-pressed', 'false');
    // The label is what a screen reader says; the mark is only for the eye, and
    // `aria-label` is what stops it being read out as "magnifying glass".
    button.textContent = TOOL_MARK;

    // Wired the way Leaflet wires its own bar buttons. Without the first line a
    // double click on the tool zooms the map underneath it and a drag from it
    // pans; without the last, the keyboard is left on the button and the arrow
    // keys stop moving the map.
    L.DomEvent.disableClickPropagation(button);
    L.DomEvent.on(button, 'click', L.DomEvent.stop);
    L.DomEvent.on(button, 'click', () => setPicking(!picking));
    L.DomEvent.on(button, 'click', this._refocusOnMap, this);

    this._button = button;
    return bar;
  },

  /** Says out loud which state the tool is in, for the eye and for the reader. */
  show(on) {
    if (!this._button) return;
    this._button.classList.toggle('armed', on);
    this._button.setAttribute('aria-pressed', String(on));
  },
});

const picker = new Picker();
map.addControl(picker);

/**
 * A bar of one button, in the shape Leaflet draws its own, in the corner.
 *
 * Not a Leaflet control: these say who is looking rather than doing anything to
 * the map, and Leaflet has one container per corner — putting them in it would
 * tie where they sit to where the zoom sits. They borrow the class and nothing
 * else.
 */
function cornerAnchor(bar, mark, label) {
  const button = L.DomUtil.create('a', 'tool', bar);
  button.href = '#';
  button.title = label;
  button.setAttribute('role', 'button');
  // Every one of these is a square with a mark in it, so the name is the only
  // thing telling a reader — or a test — which one it reached.
  button.setAttribute('aria-label', label);
  button.textContent = mark;
  L.DomEvent.on(button, 'click', L.DomEvent.stop);
  return button;
}

/**
 * A bar of one button, in the shape Leaflet draws its own.
 *
 * A second button may be added to the same bar with `cornerAnchor`, which is how
 * the zoom pair is built: Leaflet rules a line between stacked anchors and
 * rounds only the ends, so two things that belong together read as one control
 * rather than as two that happen to be near each other.
 */
function cornerButton(id, mark, label, into) {
  const bar = L.DomUtil.create('div', 'leaflet-bar', into || corner);
  bar.id = id;
  cornerAnchor(bar, mark, label);
  // Over the map, so a click or a drag on one must not reach it.
  L.DomEvent.disableClickPropagation(bar);
  L.DomEvent.disableScrollPropagation(bar);
  return bar;
}

// Not `chrome`: a browser already has one of those, and a `const` of that
// name throws before a line of this page runs.
const corner = document.getElementById('corner');
/** The settings and who you are, side by side. One is about the map and one is
 *  about you; putting them in a column would make one read as the other's. */
const row = L.DomUtil.create('div', '', corner);
row.id = 'row';
const cogBar = cornerButton('cog', '\u2699', 'Settings', row);
const accountBar = cornerButton('account', 'Unauthenticated', 'Account', row);
/** Making a marker, and deciding what one starts as: one control, two buttons. */
const mineBar = cornerButton('mine', '\u2691', 'Add a marker');
const markerButton = mineBar.querySelector('a');
const presetButton = cornerAnchor(mineBar, '\u2630', 'Presets');

/**
 * Says who is looking, and offers what only they can act on.
 *
 * The account button is always there and is greyed when nobody has followed a
 * login link: a control that appears on login moves everything under it, and a
 * page whose furniture jumps is a page somebody clicks the wrong thing on.
 *
 * What sits under it is offered to whoever can act on it. Making a marker means
 * owning one, and only somebody the game named can own anything, so the flag is
 * for people who have followed a link and for nobody else.
 */
function showAccount(me) {
  const button = accountBar.querySelector('a');
  const named = me && me.Name;
  button.textContent = named || 'Unauthenticated';
  button.classList.toggle('out', !named);
  button.title = named
    ? `Signed in as ${me.Name}`
    : 'Not signed in — run /witchlight login in the game';
  button.setAttribute('aria-label', named ? `Account: ${me.Name}` : 'Not signed in');
  mineBar.classList.toggle('on', Boolean(named));
  drawProfile();
}

/** Who the service says is looking. Asked at load, which is when it changes:
 *  following a login link lands back here as a fresh page. */
async function pollMe() {
  try {
    viewer = await (await fetch('/me.json', { cache: 'no-store' })).json();
  } catch (error) {
    viewer = null;
  }
  showAccount(viewer);
  await pollMine();
  drawProfile();
}

/**
 * The one block the picker is on, outlined so that "under the pointer" is exact.
 *
 * A rectangle in world coordinates rather than a box drawn at the pointer: it is
 * a block that is being named, so it must stay on that block while the map moves
 * and grow with it as the view zooms in.
 */
const outline = L.rectangle([at(0, 0), at(1, 1)], {
  color: '#4dd2ff', weight: 1, fill: false, interactive: false,
});

function setPicking(on) {
  picking = on;
  picker.show(on);
  map.getContainer().classList.toggle('picking', on);
  if (!on) forget();
  say();
}

/** Nothing is being pointed at, so nothing is claimed about anything. */
function forget() {
  picked = null;
  told = null;
  layer(outline, false);
}

/** Whether what the service last said is about this block. */
function about(block) {
  return told !== null && block !== null && told.x === block.x && told.z === block.z;
}

/**
 * Moves the outline onto the block under the pointer, and asks about it.
 *
 * Only when the block changes: a pointer sliding across a tile crosses hundreds
 * of them at a coarse zoom, and every one of those is a request nobody reads.
 */
function pick(latlng) {
  if (!picking || !latlng) return;

  const block = { x: Math.floor(latlng.lng), z: Math.floor(latlng.lat) };
  if (picked && picked.x === block.x && picked.z === block.z) return;

  picked = block;
  outline.setBounds([at(block.x, block.z), at(block.x + 1, block.z + 1)]);
  layer(outline, true);
  say();
  ask();
}

/**
 * Asks the service about whichever block the pointer has come to rest on.
 *
 * One request in flight and the rest coalesced into the latest position, so
 * crossing the map costs one answer rather than a queue of stale ones.
 */
async function ask() {
  if (asking) return;
  asking = true;
  try {
    while (picking && picked && !about(picked)) {
      told = await lookUp(picked.x, picked.z);
      say();
    }
  } finally {
    asking = false;
  }
}

async function lookUp(x, z) {
  try {
    const answer = await fetch(`/block.json?x=${x}&z=${z}`, { cache: 'no-store' });
    if (!answer.ok) throw new Error(answer.status);
    return await answer.json();
  } catch (error) {
    // Still an answer about that block, or the loop above would ask again as
    // fast as the service could refuse. The service may simply be restarting.
    return { x, z, state: 'unreachable' };
  }
}

/**
 * What the picker is on, in words the map can honestly use.
 *
 * A column nobody has exported has nothing on it to name, and says that rather
 * than naming a block that is not there. Everything else is what the renderer
 * read for that same pixel, so the line and the colour under it agree.
 */
function describe() {
  if (!picked) return '';
  if (!about(picked)) return 'looking…';

  switch (told.state) {
    case 'unmapped':
      return 'nothing exported here';
    case 'unreachable':
      return 'the service is not answering';
    case 'unknown':
      return `block ${told.block} — not in the palette`;
    default:
      return `${shortCode(told.code)}   y ${told.y}   ` +
             `${Math.round(told.temperature)}°C   ${Math.round(told.rainfall * 100)}% rain`;
  }
}

/** A block code as a reader wants it: `game:rock-granite` is just rock-granite. */
function shortCode(code) {
  return String(code ?? '').replace(/^game:/, '');
}

function say() {
  if (!terrain) return;
  const seen = pointer || map.getCenter();
  const [x, z] = said(seen.lng, seen.lat);
  const perBlock = scaleAt(map.getZoom(), NATIVE_ZOOM);
  hudWhere.textContent =
    `x ${x}   z ${z}   ` +
    `${perBlock.toFixed(2)} px/block   level ${levelFor(Math.round(map.getZoom()), NATIVE_ZOOM)}   ` +
    `${chunks} chunks   ${players.length} online`;
  hudWhat.textContent = picking ? describe() : '';
}

map.on('move zoom', say);
// Under the pointer when there is one, the middle of the view when there is not.
map.on('mousemove', event => {
  pointer = event.latlng;
  pick(event.latlng);
  hover(event.latlng);
  say();
});
map.on('mouseout', () => { pointer = null; forget(); say(); });

// Dragging is choosing to look somewhere else, so it stops following. Zooming is
// not, so it does not.
map.on('dragstart', () => {
  if (following !== null) follow(following);
});
map.on('moveend zoomend', writeAddress);
addEventListener('hashchange', () => {
  const asked = readAddress();
  if (asked) map.setView(at(asked.x, asked.z), asked.zoom);
});

/**
 * Windows over the map.
 *
 * Three of them — the marker form, the presets, and who you are — and one set of
 * manners between them: shown by a class, moved by their bar, closed by the mark
 * in their corner, and kept where they were put for as long as the page is open.
 *
 * They float rather than sitting in the layout because everything else here is
 * anchored to a corner of the map and would have to move aside for them. A
 * window that covers the zoom is a window somebody drags; a page that reshuffles
 * itself is a page where the button moved out from under the pointer.
 */

/** Where each window has been put, by the element it is. */
const windowsAt = new Map();

/**
 * Puts a window somewhere it can still be reached.
 *
 * A bar dragged off the top or past a side cannot be grabbed again, and the only
 * way back would be reloading the page — so a margin of it is kept on screen
 * whatever is asked for, including when the browser is resized under it.
 */
function settleWindow(panel, left, top) {
  const held = 60;
  const box = panel.getBoundingClientRect();
  const x = Math.min(Math.max(left, held - box.width), innerWidth - held);
  const y = Math.min(Math.max(top, 0), innerHeight - 30);
  panel.style.left = `${Math.round(x)}px`;
  panel.style.top = `${Math.round(y)}px`;
  windowsAt.set(panel, { x, y });
}

/**
 * Makes a window's bar move it.
 *
 * Pointer events rather than mouse ones, so a finger drags it too, and the
 * pointer is captured so a hand that outruns the window keeps hold of it. The
 * map underneath never hears any of this: the window already stops clicks, and
 * the bar takes the pointer for the length of the drag.
 */
function dragBy(panel) {
  const bar = panel.querySelector('.bar');
  bar.addEventListener('pointerdown', event => {
    // A right click on a window is not a drag, and it must not open a marker
    // form on the map underneath either.
    if (event.button !== 0) return;

    // Nor is a press on something in the bar that does its own job. Capturing
    // the pointer sends the release to the bar, and a click is delivered to the
    // nearest ancestor of where it went down and where it came up — so a bar
    // that captures on every press eats the press on its own close button, and
    // the mark does nothing at all.
    if (event.target.closest('button, input, a, select')) return;

    const box = panel.getBoundingClientRect();
    const grip = { x: event.clientX - box.left, y: event.clientY - box.top };

    bar.setPointerCapture(event.pointerId);
    bar.classList.add('held');
    event.preventDefault();

    const moved = at => settleWindow(panel, at.clientX - grip.x, at.clientY - grip.y);
    const done = () => {
      bar.classList.remove('held');
      bar.removeEventListener('pointermove', moved);
      bar.removeEventListener('pointerup', done);
      bar.removeEventListener('pointercancel', done);
    };
    bar.addEventListener('pointermove', moved);
    bar.addEventListener('pointerup', done);
    bar.addEventListener('pointercancel', done);
  });

  // Only the bar's own mark. `.shut` is the shape of a small × and a preset row
  // has one to delete itself with, which is not a window closing.
  for (const shut of panel.querySelectorAll('.bar .shut')) {
    shut.addEventListener('click', () => shutWindow(panel));
  }
  // Over the map, so a click, a drag or a scroll on a window must not reach it.
  L.DomEvent.disableClickPropagation(panel);
  L.DomEvent.disableScrollPropagation(panel);
}

/**
 * Shows a window, where it was left or where it belongs.
 *
 * `middle` opens it centred, which is where something about you rather than
 * about a place on the map wants to be. Measured only once it is shown: a window
 * still `display:none` has no size, and both keeping it on screen and centring
 * it are sums over its width.
 */
function openWindow(panel, middle) {
  panel.classList.add('open');
  const held = windowsAt.get(panel);
  if (held) {
    settleWindow(panel, held.x, held.y);
  } else if (middle) {
    const box = panel.getBoundingClientRect();
    settleWindow(panel, (innerWidth - box.width) / 2, (innerHeight - box.height) / 2);
  }
}

function shutWindow(panel) {
  panel.classList.remove('open');
  if (panel === composer) forgetCompose();
}

/**
 * Making and changing a marker.
 *
 * The game is the only thing that can do either: a waypoint lives on the game
 * server, belongs to a player the game knows, and appears on that player's own
 * map. So nothing here makes anything. The form asks, the service holds the ask
 * until the mod collects it, and the marker arrives on the next poll like any
 * other. What the page can honestly say is "asked for", and then whether it
 * turned up.
 *
 * Three ways in, one form. A right click on the map names the spot before the
 * form opens, which is what somebody who can already see where they mean wants.
 * The flag button opens it with the spot unnamed, to be typed or picked. A right
 * click on a marker opens it on that marker, to be changed.
 */

/** The colours the game offers, in the order its own picker shows them. */
let palette = [];

/** Which colour and picture the form is on. */
let chosenColour = '#ffffff';
let chosenPicture = 'circle';

/** Whether the next click on the map names the spot rather than doing nothing. */
let placing = false;

/** The marker this page asked for and has not seen arrive, and when it asked. */
let awaiting = null;
let askedAt = 0;

/**
 * What the form is for: a new marker, a marker that exists, or a preset.
 *
 * One window rather than three, because every choice on it — a name, a colour, a
 * picture, who sees it — is the same choice in all three cases. What changes is
 * where the answer goes and what the button that sends it is called.
 */
let mode = 'new';

/** The marker being changed, when there is one. */
let editing = null;

/** Which preset is being changed, by its place in the list. */
let editingPreset = -1;

/** What was under the pointer when the form was opened: the block code a preset
 *  is remembered against, and what the game calls it. */
let clicked = null;

/** Who the service says is looking. Kept because the form needs it after load. */
let viewer = null;

/** What this person has set for themselves — their presets, and where their new
 *  markers start. Read at login and again whenever they change it. */
let mine = { Presets: [], PresetsByDefault: false };

/** How long a marker may take to appear before the page stops expecting it.
 *  The mod collects every two seconds, so this is a game server that has gone. */
const MARKER_PATIENCE = 20000;

/** How long a marker's details stay up once the pointer has left it. Long
 *  enough to be crossed on the way to reading them, short enough that a map
 *  swept over is not left covered in boxes. */
const HOVER_LINGER = 2500;

/** The marker a hover opened, and the wait that will close it again. */
let hovered = null;
let hoverTimer = null;

/** Something is still being read, so nothing is closing. */
function keepHovered() {
  clearTimeout(hoverTimer);
  hoverTimer = null;
}

/** Closes what a hover opened, after a moment. */
function closeHovered() {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    if (hovered) hovered.closePopup();
    hovered = null;
    hoverTimer = null;
  }, HOVER_LINGER);
}

/** Nothing is being hovered any more — the markers themselves have gone. */
function forgetHovered() {
  keepHovered();
  hovered = null;
}

const composer = document.getElementById('compose');
const composeTitle = document.getElementById('compose-title');
const markerName = document.getElementById('marker-name');
const markerX = document.getElementById('marker-x');
const markerY = document.getElementById('marker-y');
const markerZ = document.getElementById('marker-z');
const markerPrivate = document.getElementById('marker-private');
const markerRemember = document.getElementById('marker-remember');
const rememberLine = document.getElementById('remember-line');
const rememberWhat = document.getElementById('remember-what');
const markerPattern = document.getElementById('marker-pattern');
const markerPick = document.getElementById('marker-pick');
const markerSave = document.getElementById('marker-save');
const saidHere = document.getElementById('said');

/** A position the reader typed, in the numbers the world itself uses. The
 *  inverse of `said`, and it has to stay so or a marker lands a spawn away. */
const meant = (x, z) => settings.absolute.on
  ? [Math.round(x), Math.round(z)]
  : [Math.round(x + spawn.x), Math.round(z + spawn.z)];

/** What the form is saying, and whether it is a complaint. */
function sayHere(what, wrong) {
  saidHere.textContent = what || '';
  saidHere.classList.toggle('wrong', Boolean(wrong));
}

/**
 * Whether a preset's pattern names this block.
 *
 * `*` stands for any run of characters and everything else is itself, which is
 * the whole grammar: a pattern is read by whoever typed it, and one that needed
 * escaping rules would be a pattern nobody could check by eye. Matched here
 * rather than by the service, because this is the side holding both the code
 * under the pointer and the presets to try against it.
 */
function fits(pattern, code) {
  if (!pattern || !code) return false;
  const parts = String(pattern).toLowerCase().split('*');
  const said = String(code).toLowerCase();
  let at = 0;

  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (part === '') continue;
    const found = i === 0 ? (said.startsWith(part) ? 0 : -1) : said.indexOf(part, at);
    if (found < 0) return false;
    at = found + part.length;
  }
  // A pattern not ending in `*` has to reach the end of the code, or `rock-*`
  // and `rock` would both answer for every rock there is.
  const last = parts[parts.length - 1];
  return last === '' || said.endsWith(last);
}

/** The first preset that names this block, or nothing. */
function presetFor(code) {
  return (mine.Presets || []).find(preset => fits(preset.Pattern, code)) || null;
}

/** Where a new marker starts when nobody has said otherwise: what this person
 *  chose, and failing that what the operator set. */
function privateByDefault() {
  if (mine.PrivateByDefault === true || mine.PrivateByDefault === false) {
    return mine.PrivateByDefault;
  }
  return !(viewer && viewer.MarkersPublic);
}

/**
 * Opens the form on a spot, filling in whatever is known about what is there.
 *
 * A spot is in the world's own numbers; the fields show them the way the rest of
 * the page does, so what is typed here and what the corner reads are the same two
 * numbers. `ground` is what the map knows about that block — its code and the
 * name the game gives it — which is what a preset is matched against and what
 * the marker is called when no preset names it.
 */
function openCompose(spot, ground) {
  mode = 'new';
  editing = null;
  editingPreset = -1;
  clicked = ground || null;
  composeTitle.textContent = 'New marker';
  markerSave.textContent = 'Save';

  if (spot) {
    const [x, z] = said(spot.x, spot.z);
    markerX.value = x;
    markerZ.value = z;
    if (spot.y !== undefined && spot.y !== null) markerY.value = spot.y;
  }

  const preset = clicked ? presetFor(clicked.code) : null;
  if (preset) {
    markerName.value = preset.Title || clicked.name || shortCode(clicked.code);
    if (preset.Color) chosenColour = preset.Color;
    if (preset.Icon) chosenPicture = preset.Icon;
    markerPrivate.checked =
      preset.Private === true || preset.Private === false ? preset.Private : privateByDefault();
  } else {
    markerName.value = clicked ? (clicked.name || shortCode(clicked.code) || '') : '';
    markerPrivate.checked = privateByDefault();
  }

  markerRemember.checked = Boolean(mine.PresetsByDefault) && Boolean(clicked && clicked.code);
  // What it would be remembered against, ready to be widened into a pattern.
  markerPattern.value = clicked && clicked.code ? clicked.code : '';
  showRemember();
  showCompose();
}

/** Opens the form on a marker that already exists, to change it. */
function editCompose(place) {
  mode = 'marker';
  editing = place;
  editingPreset = -1;
  clicked = null;
  composeTitle.textContent = 'Edit marker';
