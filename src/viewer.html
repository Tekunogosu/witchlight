<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapstique</title>
<link rel="stylesheet" href="/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #14141a; color: #cfcfd6;
               font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #map { position: absolute; inset: 0; background: #14141a; }
  .leaflet-container { background: #14141a; outline: none; }
  /* One pixel is one block, so a magnified tile must stay blocks and not blur. */
  .leaflet-tile { image-rendering: pixelated; }
  #who { position: absolute; right: 12px; top: 12px; z-index: 500; width: 216px;
         max-height: calc(100% - 24px); overflow-y: auto;
         display: flex; flex-direction: column; gap: 6px; }
  #who:empty { display: none; }
  .card { display: grid; grid-template-columns: 40px 1fr; gap: 9px;
          align-items: center; padding: 8px 10px;
          background: #000000cc; border: 1px solid #33333f; border-radius: 4px;
          cursor: pointer; }
  .card:hover { border-color: #4dd2ff66; background: #0a0a12dd; }
  .card.followed { border-color: #4dd2ff; background: #0d1a22ee; }
  .card .face { width: 40px; height: 40px; border-radius: 3px; background: #1c1c24;
                border: 1px solid #33333f; display: grid; place-items: center;
                font-size: 17px; color: #6f7a86; overflow: hidden; }
  .card .face svg { width: 100%; height: 100%; display: block; }
  /* A portrait is one block per pixel of a rendered seraph, so it is scaled the
     way the terrain is: crisp, rather than smeared into a thumbnail. */
  .card .face img { width: 100%; height: 100%; display: block; object-fit: contain;
                    image-rendering: pixelated; }
  /* A grid column will not shrink below its content unless told it may, and a
     player may call themselves anything, so without this a long name pushes the
     card and its bars out past their own border. */
  .card > div:last-child { min-width: 0; }
  .card .name { color: #e8e8ee; font-size: 12px; margin-bottom: 4px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; border-radius: 3px; background: #ffffff14; margin-top: 3px;
         overflow: hidden; }
  .bar > i { display: block; height: 100%; }
  .bar.hp > i { background: #e05a5a; }
  .bar.food > i { background: #74a94a; }
  #cog { position: absolute; right: 12px; bottom: 12px; z-index: 500;
         width: 40px; height: 40px; display: grid; place-items: center;
         background: #000000cc; border: 1px solid #33333f; border-radius: 4px;
         color: #cfcfd6; cursor: pointer; font-size: 20px; line-height: 1;
         user-select: none; }
  #cog:hover { border-color: #4dd2ff66; color: #fff; }
  #settings { position: absolute; right: 12px; bottom: 60px; z-index: 500;
              width: 216px; padding: 10px 12px; background: #000000e6;
              border: 1px solid #33333f; border-radius: 4px; display: none; }
  #settings.open { display: block; }
  #settings h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em;
                 text-transform: uppercase; color: #8a8a96; font-weight: normal; }
  #settings label { display: flex; align-items: center; gap: 8px; padding: 4px 0;
                    font-size: 12px; color: #cfcfd6; cursor: pointer; }
  #settings input { accent-color: #4dd2ff; margin: 0; }
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 500;
         padding: 7px 11px; background: #000000cc; border: 1px solid #33333f;
         border-radius: 4px; pointer-events: none; white-space: pre; }
  .player, .marker { background: none; border: none; }
  .pin { display: block; width: 10px; height: 10px; margin: -5px 0 0 -5px;
         border: 2px solid #000000cc; border-radius: 50%; background: #4dd2ff; }
  .diamond { display: block; width: 11px; height: 11px; margin: -6px 0 0 -6px;
             border: 1.5px solid #000000aa; transform: rotate(45deg); }
  /* The game's own marker pictures are single colour silhouettes, so they are
     used as a mask and filled with the colour their owner chose — the same way
     the game draws them. A drop shadow stands in for an outline, since a mask
     has no edge of its own to stroke. */
  .icon { display: block; width: 18px; height: 18px; margin: -9px 0 0 -9px;
          -webkit-mask-size: contain; mask-size: contain;
          -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
          -webkit-mask-position: center; mask-position: center;
          filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #000a); }
  body.no-names .tag { display: none; }
  .tag { position: absolute; left: 50%; transform: translateX(-50%);
         bottom: 9px; white-space: nowrap; font-size: 11px; color: #4dd2ff;
         text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #1c1c24; color: #cfcfd6; border: 1px solid #33333f; }
  .leaflet-popup-content { margin: 9px 12px; font: 12px ui-monospace, monospace; }
  .leaflet-popup-content b { color: #e8e8ee; }
  .leaflet-bar a { background: #1c1c24; color: #cfcfd6; border-bottom-color: #33333f; }
  .leaflet-bar a:hover { background: #26262f; color: #fff; }
  .leaflet-control-attribution { display: none; }
</style>
<div id="map"></div>
<div id="who"></div>
<div id="settings"><h2>Show</h2></div>
<div id="cog" title="Settings">⚙</div>
<div id="hud">loading…</div>
<script src="/leaflet.js"></script>
<script>
const TILE = __TILE__;
const bounds = { minX: __MIN_X__, minZ: __MIN_Z__, maxX: __MAX_X__, maxZ: __MAX_Z__ };

/**
 * Where the game counts from.
 *
 * Vintage Story shows every coordinate a player sees relative to world spawn,
 * while the world itself is a million blocks across with spawn near the middle.
 * Showing absolute positions is not wrong, but it agrees with nothing the player
 * can compare it against, which comes to the same thing.
 */
let spawn = { x: 0, z: 0 };

/** A world position as the game would say it. */
const said = (x, z) => settings.absolute.on
  ? [Math.round(x), Math.round(z)]
  : [Math.round(x - spawn.x), Math.round(z - spawn.z)];

/** How far past one block per pixel the view may go. Costs no extra tiles: Leaflet
 *  stretches the finest level rather than asking for one that does not exist. */
const ZOOM_IN_BEYOND_NATIVE = 3;

/**
 * The Leaflet zoom at which one pixel is one block, fixed once and never moved.
 *
 * It would be tempting to put the finest level at whatever zoom the world happens
 * to need today, but the world grows: a player walking far enough adds a level,
 * and everything would shift underneath. Pinning it means growth only ever
 * changes how far out the view may go, which is one call and no teardown.
 *
 * Sixteen is 65,536 blocks to a pixel at the coarsest — past any world.
 */
const NATIVE_ZOOM = 16;

/** A world block position as Leaflet sees it. Latitude is Z, longitude is X. */
const at = (x, z) => L.latLng(z, x);

/**
 * Pixels per block at a Leaflet zoom, given which zoom is the finest level.
 *
 * One at the finest, halving for every level out. Leaflet counts zoom upward as
 * detail grows and the levels are numbered from the finest downward, so this and
 * `levelFor` are the whole of the translation between the two.
 */
function scaleAt(zoom, native) {
  return Math.pow(2, zoom - native);
}

/** Which stored level a Leaflet zoom asks for. Never past the finest there is. */
function levelFor(zoom, native) {
  return Math.max(0, native - zoom);
}

/** The zoom that draws this many pixels per block. The inverse of `scaleAt`. */
function zoomFor(perBlock, native) {
  return native + Math.log(perBlock) / Math.LN2;
}

/** How Leaflet names a tile it is holding, for replacing one in place. */
function tileKey(level, x, z, native) {
  return `${x}:${z}:${native - level}`;
}

let generation = 0;
let levels = 0;
let chunks = 0;
let players = [];
/** Marker pictures the service has. A name not in here gets a plain shape. */
let icons = new Set();


const hud = document.getElementById('hud');
const who = document.getElementById('who');

/**
 * What the reader has chosen to see.
 *
 * Kept in the browser rather than on the server: these are one person's
 * preferences about one screen, and everybody looking at the same map is
 * entitled to a different answer.
 */
const settings = {
  players: { label: 'Players', on: true, apply: on => layer(people, on) },
  markers: { label: 'Markers', on: true, apply: on => layer(places, on) },
  panel: { label: 'Player list', on: true, apply: on => { who.style.display = on ? '' : 'none'; } },
  absolute: { label: 'Absolute coordinates', on: false, apply: () => say() },
  names: { label: 'Player names', on: true, apply: on => {
    document.body.classList.toggle('no-names', !on);
  } },
};

function layer(group, on) {
  if (on) {
    if (!map.hasLayer(group)) map.addLayer(group);
  } else if (map.hasLayer(group)) {
    map.removeLayer(group);
  }
}

function buildSettings() {
  const panel = document.getElementById('settings');
  for (const [key, setting] of Object.entries(settings)) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = setting.on;
    box.addEventListener('change', () => {
      setting.on = box.checked;
      remember();
      setting.apply(box.checked);
    });
    label.append(box, document.createTextNode(setting.label));
    panel.append(label);
  }

  document.getElementById('cog').addEventListener('click', event => {
    event.stopPropagation();
    panel.classList.toggle('open');
  });
  // Anywhere else closes it, including the map underneath.
  addEventListener('click', () => panel.classList.remove('open'));
  panel.addEventListener('click', event => event.stopPropagation());
}

/** Choices survive a reload; a browser that refuses to remember is not an error. */
function remember() {
  try {
    const state = {};
    for (const [key, setting] of Object.entries(settings)) state[key] = setting.on;
    localStorage.setItem('mapstique.settings', JSON.stringify(state));
  } catch (error) {
    /* private windows and cleared storage are allowed to say no */
  }
}

function recall() {
  try {
    const state = JSON.parse(localStorage.getItem('mapstique.settings') || '{}');
    for (const [key, setting] of Object.entries(settings)) {
      if (typeof state[key] === 'boolean') setting.on = state[key];
    }
  } catch (error) {
    /* whatever was stored is not usable, so the defaults stand */
  }
}

/**
 * Blocks rather than degrees, and north stays up.
 *
 * `CRS.Simple` halves the scale for every zoom level down from zero; this shifts
 * that so the scale is one to one at the finest level instead, which is where one
 * pixel is one block. The transformation drops the vertical flip `Simple` applies,
 * because world Z already grows downward in a tile.
 */
function blockCrs(native) {
  return L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(1, 0, 1, 0),
    scale: zoom => scaleAt(zoom, native),
    zoom: scale => Math.log(scale) / Math.LN2 + native,
  });
}

/**
 * The terrain, at whichever level suits the zoom.
 *
 * Leaflet counts zoom upward as detail grows; the levels are numbered from the
 * finest, so that a world getting bigger adds numbers rather than renaming every
 * tile already written. The two meet here and nowhere else.
 */
const Terrain = L.TileLayer.extend({
  getTileUrl(coords) {
    const level = levelFor(coords.z, this.options.maxNativeZoom);
    return `/tiles/${level}/${coords.x}/${coords.y}.png?v=${generation}`;
  },

  /**
   * Refetches only the tiles named, leaving the rest of the map alone.
   *
   * `redraw()` would throw away every tile and ask again for all of them, which
   * for one person building a wall is hundreds of tiles to redraw one. The
   * service says exactly which tiles changed, so only those are replaced — and
   * each is swapped once its replacement has decoded, so nothing blinks.
   */
  refresh(changed) {
    for (const [level, x, z] of changed) {
      const key = tileKey(level, x, z, this.options.maxNativeZoom);
      const held = this._tiles && this._tiles[key];
      if (!held || !held.el) continue;

      const next = new Image();
      next.onload = () => { held.el.src = next.src; };
      next.src = `/tiles/${level}/${x}/${z}.png?v=${generation}`;
    }
  },
});

const map = L.map('map', {
  crs: blockCrs(NATIVE_ZOOM),
  attributionControl: false,
  zoomControl: true,
  zoomSnap: 0,
  maxBoundsViscosity: 0.7,
});

let terrain = null;

/**
 * Follows the world as it grows.
 *
 * Called on every export that adds anything, which while somebody is exploring is
 * most of them, so it must not disturb what is on screen. Nothing is torn down and
 * the view is never moved: the layer keeps its tiles, and only the edges of what
 * may be asked for move outward.
 */
function resize() {
  // Nothing exported yet. Every server is here for a moment after a format change
  // clears the map, and a viewer that threw would look like the upgrade failed.
  if (bounds.maxX <= bounds.minX || bounds.maxZ <= bounds.minZ) {
    hud.textContent = 'waiting for the server to export';
    return;
  }

  const world = L.latLngBounds(at(bounds.minX, bounds.minZ), at(bounds.maxX, bounds.maxZ));
  const first = terrain === null;

  map.setMaxBounds(world.pad(0.25));
  // Only how far out may change. One pixel per block stays at NATIVE_ZOOM
  // whatever the world does, so nothing already drawn moves.
  map.setMinZoom(NATIVE_ZOOM - levels);
  map.setMaxZoom(NATIVE_ZOOM + ZOOM_IN_BEYOND_NATIVE);

  if (first) {
    terrain = new Terrain('', {
      tileSize: TILE,
      minNativeZoom: NATIVE_ZOOM - levels,
      maxNativeZoom: NATIVE_ZOOM,
      // Without this Leaflet asks for tiles across an infinite plane: `CRS.Simple`
      // has no edges of its own, and most of a zoomed out view is world nobody
      // has ever been to.
      bounds: world,
      // Stated, not inherited. A tile layer defaults to a maximum zoom of 18,
      // and that limit is tested against the map's own zoom before it is clamped
      // to the finest level — so zooming past 18 dropped every tile and left the
      // page black, at exactly the magnification `maxNativeZoom` exists to serve.
      minZoom: 0,
      maxZoom: NATIVE_ZOOM + ZOOM_IN_BEYOND_NATIVE,
      // A tile the service has not built answers 404. Without something to put
      // there the browser draws a broken image, which on a world explored in an
      // awkward shape is a grid of them.
      errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
      noWrap: true,
      keepBuffer: 2,
      updateWhenZooming: false,
      className: 'terrain',
    }).addTo(map);
    // A link to a particular view wins over fitting the world, so that opening
    // one lands where it says rather than somewhere else for a moment first.
    const asked = readAddress();
    if (asked) map.setView(at(asked.x, asked.z), asked.zoom);
    else map.fitBounds(world);
    return;
  }

  // The layer reads both of these when it decides what to ask for next, so a
  // world that has grown is picked up without touching a tile already drawn.
  terrain.options.bounds = world;
  terrain.options.minNativeZoom = NATIVE_ZOOM - levels;
}

/**
 * Where the map is, in the address bar.
 *
 * `#x,z,px-per-block` — the same three numbers the corner shows, so a link says
 * what it points at and someone can read one without following it. It is also the
 * only way to ask for a particular view from outside the page, which is what makes
 * the zoom levels testable at all.
 */
function readAddress() {
  const found = location.hash.match(/^#(-?\d+),(-?\d+),([\d.]+)$/);
  if (!found) return null;
  const perBlock = Number(found[3]);
  if (!(perBlock > 0)) return null;
  return { x: Number(found[1]), z: Number(found[2]), zoom: zoomFor(perBlock, NATIVE_ZOOM) };
}

function writeAddress() {
  if (!terrain) return;
  const centre = map.getCenter();
  const perBlock = scaleAt(map.getZoom(), NATIVE_ZOOM).toFixed(2);
  // Replace rather than push: panning a map should not fill the back button.
  history.replaceState(null, '', `#${Math.round(centre.lng)},${Math.round(centre.lat)},${perBlock}`);
}

const people = L.layerGroup().addTo(map);
const places = L.layerGroup().addTo(map);

/** Players on the map, by the identity that survives a rename. */
const drawnPlayers = new Map();

/**
 * Moves the players who moved.
 *
 * Everything here used to be cleared and rebuilt on every poll, which at forty
 * markers and a picture each was forty elements destroyed and recreated every two
 * seconds — a map that flickered twice a minute for every minute it was open.
 * A player who is still online keeps the marker they had and is moved to where
 * they are now.
 */
function drawPlayers() {
  const seen = new Set();

  for (const player of players) {
    const uid = String(player.Uid || player.Name);
    seen.add(uid);

    const drawn = drawnPlayers.get(uid);
    if (drawn) {
      drawn.marker.setLatLng(at(player.X, player.Z));
      // Only the parts that can change: the popup carries their position.
      drawn.marker.setPopupContent(popupFor(player));
      continue;
    }

    const marker = L.marker(at(player.X, player.Z), {
      icon: L.divIcon({
        className: 'player',
        html: `<i class="pin"></i><span class="tag">${escaped(player.Name)}</span>`,
      }),
      // Above markers: a player is the thing that is moving.
      zIndexOffset: 1000,
    })
      .bindPopup(popupFor(player))
      .addTo(people);
    drawnPlayers.set(uid, { marker });
  }

  for (const [uid, drawn] of drawnPlayers) {
    if (!seen.has(uid)) {
      people.removeLayer(drawn.marker);
      drawnPlayers.delete(uid);
    }
  }
}

/** What the markers looked like last time, so an unchanged set is left alone. */
let drawnPlaces = null;

/**
 * Draws the markers, when they are not the ones already drawn.
 *
 * Markers change a few times an hour and arrive every two seconds. Rebuilding
 * them on arrival meant tearing down every marker on the map to discover that
 * none of them had moved.
 */
function drawPlaces(waypoints) {
  const shape = JSON.stringify(waypoints);
  if (shape === drawnPlaces) {
    return;
  }
  drawnPlaces = shape;

  places.clearLayers();
  for (const place of waypoints) {
    const colour = /^#[0-9a-f]{6}$/i.test(place.Color || '') ? place.Color : '#ffffff';
    const name = String(place.Icon || '');
    const shape = icons.has(name)
      ? `<i class="icon" style="background:${colour};` +
        `-webkit-mask-image:url(/icons/${encodeURIComponent(name)}.svg);` +
        `mask-image:url(/icons/${encodeURIComponent(name)}.svg)"></i>`
      : `<i class="diamond" style="background:${colour}"></i>`;
    // Every death marker is titled "You died here", so the owner is the only
    // thing that says whose it is.
    const owner = place.Owner ? `<br><span style="color:#a8a8b4">${escaped(place.Owner)}</span>` : '';
    L.marker(at(place.X, place.Z), {
      icon: L.divIcon({ className: 'marker', html: shape }),
    })
      .bindPopup(`<b>${escaped(place.Title || 'marker')}</b>${owner}<br>` +
                 `${said(place.X, place.Z)[0]}, ${place.Y}, ${said(place.X, place.Z)[1]}`)
      .addTo(places);
  }
}

/** Cards on the panel, by the player they stand for. */
const cards = new Map();

/** Whose view the map is keeping, if anyone's. */
let following = null;

/**
 * Keeps the map on one player until somebody drags it.
 *
 * Zooming does not stop it: changing how close you are looking is not the same as
 * choosing to look somewhere else. Dragging is, so that ends it — and so does
 * clicking the same player again.
 */
function follow(uid) {
  following = following === uid ? null : uid;
  for (const [id, card] of cards) {
    card.element.classList.toggle('followed', id === following);
  }
  keepUp();
}

function keepUp() {
  if (following === null) {
    return;
  }
  const player = players.find(p => String(p.Uid || p.Name) === following);
  if (player) {
    map.panTo(at(player.X, player.Z), { animate: true, duration: 0.4 });
  }
}

/**
 * Who is online, down the right hand side.
 *
 * Health and food come from the server, which already knows them, so nothing is
 * asked of anyone to show them. Clicking a card follows that player until the map
 * is dragged.
 *
 * Nothing here is rebuilt. Cards are made once and then written into, so the
 * panel keeping up with the world never disturbs what is on the screen.
 */
function drawWho() {
  const seen = new Set();

  for (const player of players) {
    const uid = String(player.Uid || player.Name);
    seen.add(uid);
    patchCard(cards.get(uid) || newCard(uid), player);
  }

  for (const [uid, card] of cards) {
    if (!seen.has(uid)) {
      card.element.remove();
      cards.delete(uid);
      if (following === uid) following = null;
    }
  }
}

/** A card, built once. What changes on it afterwards is set, not rebuilt. */
function newCard(uid) {
  const element = document.createElement('div');
  element.className = 'card';

  const face = document.createElement('div');
  face.className = 'face';
  const about = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'name';
  const hp = bar('hp');
  const food = bar('food');
  about.append(name, hp.wrap, food.wrap);
  element.append(face, about);
  element.addEventListener('click', () => follow(uid));
  who.append(element);

  const card = { element, face, name, hp, food, look: null, named: null };
  cards.set(uid, card);
  return card;
}

/**
 * Brings one card up to date.
 *
 * Every field is compared before it is written. The panel shares the two second
 * beat the map data arrives on, and a player who is walking changes their
 * position and their food on every one of them — so rebuilding a card whenever
 * anything about its player moved meant rebuilding all of them, always. Setting a
 * width does not disturb the screen; replacing an element does.
 */
function patchCard(card, player) {
  if (card.named !== player.Name) {
    card.named = player.Name;
    card.name.textContent = player.Name;
  }

  const look = `${player.Portrait || ''}|${player.Name}`;
  if (card.look !== look) {
    card.look = look;
    card.face.textContent = '';
    card.face.append(portrait(player));
  }

  fill(card.hp, 'health', player.Health, player.MaxHealth);
  fill(card.food, 'food', player.Saturation, player.MaxSaturation);

  const [x, z] = said(player.X, player.Z);
  const title = `${player.Name} — ${x}, ${player.Y}, ${z}`;
  if (card.element.title !== title) {
    card.element.title = title;
  }
}

/**
 * What goes in a player's card.
 *
 * A picture their own client drew of them where there is one, and their initial
 * where there is not. There is nothing in between worth drawing: what a seraph
 * looks like exists only on the machine rendering it, and everything the server
 * can read about an appearance amounts to less than a letter does.
 */
function portrait(player) {
  // A picture the player's own client drew of them, which is the only place a
  // seraph's real appearance exists: its skin parts are textures a dedicated
  // server does not ship, and its clothes and armour are a rendered scene rather
  // than a list of colours.
  if (player.Portrait) {
    const sent = document.createElement('img');
    sent.src = `/portraits/${encodeURIComponent(player.Portrait)}.png`;
    sent.alt = '';
    // A picture that will not load leaves a broken image in the card, which reads
    // worse than the letter it stands in for.
    sent.addEventListener('error', () => {
      const box = sent.parentElement;
      if (!box) return;
      sent.remove();
      box.append(initial(player));
    }, { once: true });
    return sent;
  }

  return initial(player);
}

/**
 * A player's initial, for anyone who has not sent a picture of themselves.
 *
 * The map used to assemble a face here out of the three colours a server can read
 * off a player — skin, hair, eyes. It was a guess at a likeness and looked like
 * one. A letter says exactly as much as the map actually knows.
 */
function initial(player) {
  const letter = document.createElement('span');
  letter.textContent = (player.Name || '?').trim().charAt(0).toUpperCase() || '?';
  return letter;
}


/** An empty bar, to be filled in later. */
function bar(kind) {
  const wrap = document.createElement('div');
  wrap.className = `bar ${kind}`;
  const inner = document.createElement('i');
  wrap.append(inner);
  return { wrap, inner, at: null };
}

/** A reading, written only when it is not the reading already there. */
function fill(bar, what, value, most) {
  const share = most > 0 ? Math.max(0, Math.min(1, value / most)) : 0;
  const width = `${(share * 100).toFixed(1)}%`;
  if (bar.at === width) {
    return;
  }
  bar.at = width;
  bar.inner.style.width = width;
  bar.wrap.title = most > 0 ? `${what} ${Math.round(value)} of ${Math.round(most)}` : '';
}

function popupFor(player) {
  const [x, z] = said(player.X, player.Z);
  return `<b>${escaped(player.Name)}</b><br>${x}, ${player.Y}, ${z}`;
}

/** Titles and names come from players, so they are text and never markup. */
function escaped(text) {
  const node = document.createElement('span');
  node.textContent = text ?? '';
  return node.innerHTML;
}

/** Where the pointer is, when it is over the map. */
let pointer = null;

function say() {
  if (!terrain) return;
  const where = pointer || map.getCenter();
  const [x, z] = said(where.lng, where.lat);
  const perBlock = scaleAt(map.getZoom(), NATIVE_ZOOM);
  hud.textContent =
    `x ${x}   z ${z}   ` +
    `${perBlock.toFixed(2)} px/block   level ${levelFor(Math.round(map.getZoom()), NATIVE_ZOOM)}   ` +
    `${chunks} chunks   ${players.length} online`;
}

map.on('move zoom', say);
// Under the pointer when there is one, the middle of the view when there is not.
map.on('mousemove', event => { pointer = event.latlng; say(); });
map.on('mouseout', () => { pointer = null; say(); });

// Dragging is choosing to look somewhere else, so it stops following. Zooming is
// not, so it does not.
map.on('dragstart', () => {
  if (following !== null) follow(following);
});
map.on('moveend zoomend', writeAddress);
addEventListener('hashchange', () => {
  const asked = readAddress();
  if (asked) map.setView(at(asked.x, asked.z), asked.zoom);
});

/**
 * Which marker pictures exist.
 *
 * Asked once at start and again whenever markers arrive naming one that is not
 * known yet — which is what happens when a mod adding markers is installed while
 * the map is open.
 */
async function pollIcons() {
  try {
    icons = new Set(await (await fetch('/icons.json')).json());
  } catch (error) {
    /* the service may be restarting */
  }
}

/** Players move constantly; markers rarely. Both are cheap to fetch. */
async function pollLive() {
  try {
    const live = await (await fetch('/live.json')).json();
    players = live.Players || [];
    const places = live.Waypoints || [];

    // A marker naming a picture nobody has heard of means the set has grown.
    if (places.some(place => place.Icon && !icons.has(String(place.Icon)))) {
      await pollIcons();
      // The pictures changed, so what is drawn no longer matches what was drawn.
      drawnPlaces = null;
    }


    drawPlayers();
    drawWho();
    keepUp();
    drawPlaces(places);
    say();
  } catch (error) {
    /* the service may be restarting */
  }
}

/**
 * Watches for terrain that has changed.
 *
 * Asking with `since` gets back the tiles that actually changed rather than a
 * bare "something did", so a server where one person is building repaints one
 * square instead of the map.
 */
async function pollWorld() {
  try {
    const query = generation === 0 ? '' : `?since=${generation}`;
    const info = await (await fetch(`/info.json${query}`, { cache: 'no-store' })).json();
    if (info.generation === generation) return;

    const grew = terrain === null
      || info.levels !== levels
      || info.minX < bounds.minX || info.maxX > bounds.maxX
      || info.minZ < bounds.minZ || info.maxZ > bounds.maxZ;

    generation = info.generation;
    chunks = info.chunks;
    levels = info.levels ?? 0;
    spawn = { x: info.spawnX ?? 0, z: info.spawnZ ?? 0 };
    Object.assign(bounds, info);

    // Growing and changing are not the same thing. A world that has grown needs
    // its edges moved, and the tiles that changed still need replacing — usually
    // both at once, since the export that added a region also drew it.
    if (grew) resize();
    if (info.tiles) terrain?.refresh(info.tiles);
    else if (!grew) terrain?.redraw();
    say();
  } catch (error) {
    /* the service may be restarting; try again next time */
  }
}

recall();
buildSettings();
for (const setting of Object.values(settings)) setting.apply(setting.on);

setInterval(pollLive, 2000);
setInterval(pollWorld, 5000);
pollWorld().then(pollIcons).then(pollLive);
</script>
