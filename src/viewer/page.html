<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witchlight</title>
<link rel="stylesheet" href="/leaflet.css?v=__ASSETS__">
<link rel="stylesheet" href="/viewer.css?v=__ASSETS__">
<!-- What a reader who cannot separate two colours is shown instead.
     Daltonisation, not simulation: the map is not made to look the way a colour
     blind reader sees it, it is repainted so that what they cannot tell apart
     becomes something they can. Each is one matrix because the whole of it is
     linear — simulate the deficiency, take what was lost, and put that back into
     the channels the eye still has. Simulation comes from Machado, Oliveira and
     Fernandes (2009) at full severity; the redistribution is the usual one.

     `linearRGB` is not decoration. These matrices are ratios of light, and
     applying them to sRGB numbers, which are not, gives the wrong answer — it
     is also SVG's default, and said out loud because a browser that changed its
     mind about that would break this quietly. -->
<svg id="cvd" aria-hidden="true" focusable="false"><defs>
  <filter id="cvd-protan" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="1.00000 0.00000 0.00000 0 0
                                         0.47890 0.47691 0.04419 0 0
                                         0.59728 -0.68869 1.09141 0 0
                                         0 0 0 1 0"/>
  </filter>
  <filter id="cvd-deutan" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="1.00000 0.00000 0.00000 0 0
                                         0.16279 0.72505 0.11216 0 0
                                         0.45469 -0.64539 1.19070 0 0
                                         0 0 0 1 0"/>
  </filter>
  <filter id="cvd-tritan" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.74116 -0.40721 0.66605 0 0
                                         0.07510 0.58523 0.33967 0 0
                                         0.00000 0.00000 1.00000 0 0
                                         0 0 0 1 0"/>
  </filter>
</defs></svg>
<div id="map"></div>
<!-- Who is online. The tabs sort what is already here rather than asking for
     anything different: everybody the server shares, or the people in a group
     with you. -->
<div id="who">
  <div class="tabs" role="tablist" aria-label="Which players are listed">
    <button class="tab on" type="button" role="tab" data-who="all"
            aria-selected="true" aria-controls="who-list">All<span class="tally"></span></button>
    <button class="tab" type="button" role="tab" data-who="group"
            aria-selected="false" aria-controls="who-list">Group<span class="tally"></span></button>
  </div>
  <div id="who-list" role="tabpanel"></div>
  <p id="who-said" class="note"></p>
</div>
<div id="corner"></div>
<div id="settings"><h2>Show</h2></div>
<div id="compose" class="window">
  <div class="bar">
    <h2 id="compose-title">New marker</h2>
    <button class="shut" type="button" title="Close" aria-label="Close"><span class="chrome masked mark-x" aria-hidden="true"></span></button>
  </div>
  <!-- The name, and the presets it could be filled in from. The button sits with
       the name because a preset's first answer is what the thing is called, and
       the list it opens is a flyout rather than a second window: it is a choice
       made inside this form and handed straight back to it. -->
  <div class="field beside">
    <input id="marker-name" type="text" maxlength="128" placeholder="Name"
           aria-label="Marker name">
    <button id="marker-preset-pick" class="aside" type="button"
            title="Fill this in from one of your presets"
            aria-label="Fill this in from one of your presets"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="preset-pick">
      <span class="chrome masked mark-bookmarks" aria-hidden="true"></span>
    </button>
  </div>
  <div class="field">
    <div id="colours" class="swatches"></div>
  </div>
  <div class="field">
    <div id="pictures" class="swatches"></div>
  </div>
  <div class="field finding" id="pattern-field"><span>Block it starts from</span>
    <input id="marker-pattern" type="text" autocomplete="off"
           placeholder="type to find a block, or a pattern with *"
           role="combobox" aria-expanded="false" aria-autocomplete="list"
           aria-controls="block-found">
    <div id="block-found" role="listbox" aria-label="Blocks found"></div>
  </div>
  <div class="field" id="place-field"><span id="place-said">Coords</span>
    <div class="place">
      <input id="marker-x" type="number" aria-label="Marker x" placeholder="x">
      <input id="marker-y" type="number" aria-label="Marker y" placeholder="y">
      <input id="marker-z" type="number" aria-label="Marker z" placeholder="z">
      <button id="marker-pick" class="tool" type="button"
              title="Pick the spot on the map" aria-label="Pick the spot on the map"
              aria-pressed="false"><span class="chrome masked mark-crosshair"
              aria-hidden="true"></span></button>
    </div>
  </div>
  <p id="said"></p>
  <div class="deed">
    <button id="marker-private" class="seen" type="button" aria-pressed="false"></button>
    <button id="marker-remember" class="keepsake" type="button"
            aria-pressed="false"><span class="chrome masked mark-bookmarks-simple"
            aria-hidden="true"></span></button>
    <!-- What the row ends with is pushed to the far side by this rather than by a
         margin on whichever button happens to be first of them: the bin comes and
         goes with what the form is open on, and a margin hung on it would take the
         gap with it. -->
    <span class="gap"></span>
    <button id="marker-drop" class="drop" type="button"
            title="Delete this marker" aria-label="Delete this marker"><span
            class="chrome masked mark-trash" aria-hidden="true"></span></button>
    <button id="marker-cancel" class="word" type="button">Cancel</button>
    <button id="marker-save" class="word go" type="button">Save</button>
  </div>
</div>

<!-- Outside the window it belongs to, and placed against it from script. A
     window scrolls its own contents, and a list hung off the side of something
     that scrolls is a list clipped at the edge of it. -->
<div id="preset-pick" class="flyout" role="listbox" aria-label="Your presets"></div>

<div id="presets" class="window">
  <div class="bar">
    <h2>Presets</h2>
    <button class="shut" type="button" title="Close" aria-label="Close"><span class="chrome masked mark-x" aria-hidden="true"></span></button>
  </div>
  <p class="note">What a marker starts as, by what you clicked. Pick one to change
     it.</p>
  <div class="find">
    <span class="chrome masked mark-magnifying-glass" aria-hidden="true"></span>
    <input id="preset-find" type="search" autocomplete="off" placeholder="find a preset"
           aria-label="Find a preset by name or pattern">
  </div>
  <div id="preset-list"></div>
  <p id="preset-said"></p>
  <div class="deed">
    <button id="preset-new" class="word go" type="button">Create</button>
  </div>
</div>

<!-- Every marker there is, as a list. The map says where each one is; this says
     what there is, which is the question a map cannot answer once there are
     forty of them spread over a million blocks. Split by who can see it, because
     "who else is looking at this" is the thing somebody checks a marker for. -->
<div id="directory" class="window">
  <div class="bar">
    <h2>Markers</h2>
    <button class="shut" type="button" title="Close" aria-label="Close"><span class="chrome masked mark-x" aria-hidden="true"></span></button>
  </div>
  <div class="tabs" role="tablist" aria-label="Which markers are listed">
    <button class="tab on" type="button" role="tab" data-tab="all"
            aria-selected="true" aria-controls="marker-list">All<span class="tally"></span></button>
    <button class="tab" type="button" role="tab" data-tab="public"
            aria-selected="false" aria-controls="marker-list">Public<span class="tally"></span></button>
    <button class="tab" type="button" role="tab" data-tab="private"
            aria-selected="false" aria-controls="marker-list">Private<span class="tally"></span></button>
  </div>
  <div class="find">
    <span class="chrome masked mark-magnifying-glass" aria-hidden="true"></span>
    <input id="marker-find" type="search" autocomplete="off" placeholder="find a marker"
           aria-label="Find a marker by name or owner">
  </div>
  <!-- Said out loud, because the list was already being sorted and not saying
       so: the service sends the markers everybody can see and then the ones only
       you can, so making a marker private moved its row to the bottom. -->
  <div id="marker-head" class="head">
    <button class="sort" type="button" data-sort="name" aria-sort="ascending"
            title="Sort by name">Name<span class="caret chrome masked mark-caret-up" aria-hidden="true"></span></button>
    <button class="sort" type="button" data-sort="spawn" aria-sort="none"
            title="Sort by how far it is from spawn">Coords<span class="caret chrome masked mark-caret-up" aria-hidden="true"></span></button>
    <button class="sort" type="button" data-sort="away" aria-sort="none"
            title="Sort by how far it is from where you are standing">Distance<span class="caret chrome masked mark-caret-up" aria-hidden="true"></span></button>
    <button class="sort" type="button" data-sort="owner" aria-sort="none"
            title="Sort by whose it is">Owner<span class="caret chrome masked mark-caret-up" aria-hidden="true"></span></button>
    <button class="sort marked" type="button" data-sort="private" aria-sort="none"
            title="Sort by who can see it" aria-label="Sort by who can see it"><span
            class="chrome masked seen-mark mark-lock" aria-hidden="true"></span><span
            class="caret chrome masked mark-caret-up" aria-hidden="true"></span></button>
  </div>
  <div id="marker-list" role="tabpanel"></div>
  <p id="marker-said"></p>
  <div class="deed">
    <button id="marker-hide" class="word" type="button">Make all private</button>
    <button id="marker-show" class="word" type="button">Make all public</button>
  </div>
</div>

<div id="profile" class="window">
  <div class="bar">
    <span id="profile-face" class="face"></span>
    <h2 id="profile-name">Not signed in</h2>
    <button class="shut" type="button" title="Close" aria-label="Close"><span class="chrome masked mark-x" aria-hidden="true"></span></button>
  </div>
  <label class="line"><input id="want-presets" type="checkbox">New markers become presets by default</label>
  <label class="line"><input id="want-private" type="checkbox">New markers are private by default</label>
  <p id="want-said" class="note"></p>
  <p id="profile-said"></p>
  <div class="deed">
    <a id="sign-out" href="/logout">Sign out</a>
    <button id="profile-revert" class="word" type="button">Cancel</button>
    <button id="profile-save" class="word go" type="button">Save</button>
  </div>
</div>
<div id="version"><span class="name">Witchlight</span> - v__VERSION__</div>
<div id="hud">
  <!-- Seven numbers in three groups, each group answering a different question:
       where the pointer is, how the map is drawn, and what the world holds.
       The unit belongs to the label so every value is a bare number, which is
       what lets a column of them stay still while the pointer moves. A place is
       three numbers and is written as one, since x, y and z are read together
       and are copied out together. -->
  <!-- Above the readout, not below it. This line comes and goes with the
       picker, and underneath it pushed the six numbers down the screen every
       time it appeared — so the row somebody is reading moved out from under
       them. The panel is anchored to the bottom, so growing upward leaves it
       exactly where it was. -->
  <div id="what"></div>
  <div id="waiting">loading…</div>
  <div id="where">
    <div class="read"><span class="key">x, y, z</span><span class="triple"><b id="at-x" class="wide">0</b>, <b id="at-y">—</b>, <b id="at-z" class="wide">0</b></span></div>
    <div class="read apart wide"><span class="key">px/block</span><b id="at-scale">0</b></div>
    <div class="read"><span class="key">level</span><b id="at-level">0</b></div>
    <div class="read apart wide"><span class="key">chunks</span><b id="at-chunks">0</b></div>
    <div class="read"><span class="key">online</span><b id="at-online">0</b></div>
  </div>
</div>
<script>
// What the server knew at the moment it served this page, so the first paint is
// already in the right place rather than jumping once `/info.json` answers.
// The only thing substituted into the page; everything else it needs is a file
// of its own, served whole and cached under this build's number.
window.witchlight = {
  tile: __TILE__,
  bounds: { minX: __MIN_X__, minZ: __MIN_Z__, maxX: __MAX_X__, maxZ: __MAX_Z__ },
};
</script>
<script src="/leaflet.js?v=__ASSETS__"></script>
<script src="/viewer.js?v=__ASSETS__"></script>
